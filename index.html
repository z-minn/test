<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二十四节气 · 时令诗境</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700;900&display=swap');

  :root {
    --accent: #c8a96e;
    --bg-dark: #140b3a;
    --ink: #f0ebfa;
    --hue-shift: 0deg;
    --season-glow: rgba(180,140,255,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg-dark);
    color: var(--ink);
    font-family: 'Noto Serif SC', 'STSong', '宋体', serif;
    overflow-x: hidden;
    filter: hue-rotate(var(--hue-shift));
    transition: filter 1.5s ease;
    background: radial-gradient(ellipse at 15% 10%, #2818A0 0%, #140b3a 40%, #0c0530 70%, #080320 100%),
                linear-gradient(135deg, #18186A 0%, #140b3a 40%, #1C0A58 70%, #100830 100%);
  }

  /* ===== 粒子画布 ===== */
  #particle-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* ===== 导航栏 ===== */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 18px 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(20,11,58,.95), transparent);
    backdrop-filter: blur(4px);
  }
  .logo {
    font-size: 1.1rem;
    letter-spacing: .3em;
    color: var(--accent);
    cursor: pointer;
  }
  nav {
    display: flex;
    gap: 8px;
  }
  nav a {
    position: relative;
    color: rgba(240,232,216,.7);
    text-decoration: none;
    padding: 8px 18px;
    font-size: .8rem;
    letter-spacing: .15em;
    transition: all .4s cubic-bezier(.4,0,.2,1);
    border-radius: 20px;
    overflow: hidden;
  }
  nav a::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent), transparent);
    opacity: 0;
    transform: scale(0);
    transition: all .4s cubic-bezier(.34,1.56,.64,1);
    border-radius: inherit;
  }
  nav a:hover { 
    color: #fff;
    transform: scale(1.05);
  }
  nav a:hover::before {
    opacity: 1;
    transform: scale(1);
  }

  /* ===== 星辰背景 ===== */
  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background: radial-gradient(ellipse at 25% 15%, rgba(80,50,160,.25) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 75%, rgba(40,80,180,.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(20,10,60,.15) 0%, transparent 70%);
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--duration) ease-in-out infinite;
    animation-delay: var(--delay);
  }
  .star.small {
    width: 1px; height: 1px;
    box-shadow: 0 0 3px 1px rgba(200,200,255,.5);
    opacity: var(--base-opacity);
  }
  .star.medium {
    width: 2px; height: 2px;
    box-shadow: 0 0 6px 2px rgba(180,160,255,.4), 0 0 10px 1px rgba(255,255,255,.3);
    opacity: var(--base-opacity);
  }
  .star.large {
    width: 3px; height: 3px;
    box-shadow: 0 0 8px 3px rgba(140,100,255,.5), 0 0 14px 2px rgba(200,160,255,.3);
    opacity: var(--base-opacity);
  }
  @keyframes twinkle {
    0%,100% { opacity: var(--base-opacity); transform: scale(1); }
    50% { opacity: 1; transform: scale(1.8); }
  }

  /* ===== 首屏 Hero ===== */
  #hero {
    position: relative;
    z-index: 1;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }

  .brush-title {
    width: min(90vw, 640px);
    margin-bottom: 28px;
  }
  .brush-title text {
    font-size: 80px;
    fill: none;
    stroke: var(--accent);
    stroke-width: 1.5;
    stroke-dasharray: 2000;
    stroke-dashoffset: 2000;
    animation: brushDraw 3s cubic-bezier(.4,0,.2,1) forwards .4s;
    font-family: 'STKaiti', 'KaiTi', serif;
  }
  @keyframes brushDraw {
    to { stroke-dashoffset: 0; fill: rgba(200,169,110,.2); }
  }

  .hero-sub {
    font-size: 1rem;
    letter-spacing: .5em;
    color: rgba(200,169,110,.9);
    opacity: 0;
    animation: fadeUp .8s ease forwards 2.6s;
  }
  .hero-desc {
    margin-top: 14px;
    font-size: .85rem;
    letter-spacing: .2em;
    color: rgba(200,169,110,.75);
    opacity: 0;
    animation: fadeUp .8s ease forwards 3s;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }

  .scroll-hint {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    opacity: 0;
    animation: fadeUp .8s ease forwards 3.5s;
  }
  .scroll-hint span {
    font-size: .7rem;
    letter-spacing: .25em;
    color: rgba(200,169,110,.8);
  }
  .scroll-line {
    width: 1px; height: 50px;
    background: linear-gradient(to bottom, var(--accent), transparent);
    animation: scrollPulse 1.8s ease-in-out infinite;
  }
  @keyframes scrollPulse {
    0%,100% { opacity:.3; transform:scaleY(1); }
    50% { opacity:1; transform:scaleY(1.2); }
  }

  .deco-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(139,115,85,.15);
    animation: ringExpand 6s ease-in-out infinite;
  }
  .deco-ring:nth-child(1) { width:300px;height:300px; animation-delay:0s; }
  .deco-ring:nth-child(2) { width:480px;height:480px; animation-delay:.6s; }
  .deco-ring:nth-child(3) { width:660px;height:660px; animation-delay:1.2s; }
  @keyframes ringExpand {
    0%,100% { transform:scale(1); opacity:.5; }
    50% { transform:scale(1.05); opacity:1; }
  }

  /* ===== 主内容区（精简） ===== */
  #main-content {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    padding: 60px 40px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ===== 节气罗盘 ===== */
  .section-title {
    font-size: 1.5rem;
    letter-spacing: .4em;
    color: var(--accent);
    margin-bottom: 8px;
    text-align: center;
  }
  .section-sub {
    font-size: .8rem;
    letter-spacing: .2em;
    color: rgba(200,169,110,.8);
    margin-bottom: 40px;
    text-align: center;
  }

  .compass-wrap {
    position: relative;
    width: min(580px, 92vw);
    height: min(580px, 92vw);
    margin: 0 auto 60px;
    pointer-events: none;
  }
  #compass-svg { width: 100%; height: 100%; pointer-events: none; }
  .compass-node { pointer-events: all; }

  /* ===== 底部 ===== */
  footer {
    position: relative;
    z-index: 1;
    padding: 40px;
    text-align: center;
    border-top: 1px solid rgba(200,169,110,.12);
    font-size: .75rem;
    letter-spacing: .15em;
    color: rgba(200,169,110,.75);
  }

  /* ===== 页面进入动画 ===== */
  .reveal {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity .9s ease, transform .9s ease;
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* 浮动装饰文字 */
  .float-char {
    position: absolute;
    font-size: 1.2rem;
    color: rgba(139,115,85,.2);
    letter-spacing: .1em;
    pointer-events: none;
    animation: floatChar 8s ease-in-out infinite;
  }
  @keyframes floatChar {
    0%,100%{transform:translateY(0) rotate(0deg);opacity:.15}
    50%{transform:translateY(-30px) rotate(5deg);opacity:.3}
  }

  /* 滚动进度条 */
  #progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 2px;
    background: linear-gradient(to right, var(--accent), #eb5757, #56ccf2);
    z-index: 200;
    transition: width .1s;
  }

  /* ===== 节气详情卷轴弹窗 ===== */
  #scroll-overlay {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease;
  }
  #scroll-overlay.open {
    opacity: 1;
    pointer-events: all;
  }
  #scroll-bg {
    position: absolute;
    inset: 0;
    background: rgba(8, 5, 20, 0.82);
    backdrop-filter: blur(24px);
  }

  /* ===== 卷轴本体 ===== */
  #scroll-box {
    position: relative;
    z-index: 1;
    width: min(620px, 94vw);
    max-height: 92vh;
    overflow-y: auto;
    overflow-x: hidden;
    /* 古典卷轴背景 */
    background: 
      linear-gradient(to bottom, rgba(25,18,55,.97) 0%, rgba(18,12,40,.98) 100%),
      repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 28px,
        rgba(200,169,110,.025) 28px,
        rgba(200,169,110,.025) 29px
      );
    border-radius: 0;
    /* 左右玉轴装饰 */
    border-left: 3px solid var(--accent);
    border-right: 3px solid var(--accent);
    box-shadow: 
      -24px 0 70px rgba(180,140,255,.06),
      24px 0 70px rgba(180,140,255,.06),
      0 0 120px rgba(180,140,255,.12),
      inset 0 0 80px rgba(180,140,255,.03);
    /* 滚动入场动画 */
    transform: translateX(110%) scaleX(.95);
    transition: transform .65s cubic-bezier(.22,1,.36,1), opacity .5s ease;
    scrollbar-width: thin;
    scrollbar-color: rgba(200,169,110,.25) transparent;
  }
  #scroll-overlay.open #scroll-box {
    transform: translateX(0) scaleX(1);
  }
  #scroll-box::-webkit-scrollbar { width: 3px; }
  #scroll-box::-webkit-scrollbar-thumb { background: rgba(200,169,110,.25); border-radius: 2px; }

  /* ===== 卷轴两端装饰 ===== */
  .scroll-roll {
    position: sticky;
    top: 0;
    left: 0;
    right: 0;
    height: 18px;
    background: linear-gradient(to right, 
      var(--accent) 0%, 
      rgba(200,169,110,.3) 8%,
      rgba(200,169,110,.3) 92%,
      var(--accent) 100%
    );
    flex-shrink: 0;
    box-shadow: 
      0 4px 16px rgba(180,140,255,.2),
      inset 0 2px 4px rgba(255,255,255,.15);
    z-index: 2;
  }
  .scroll-roll::before,
  .scroll-roll::after {
    content: '';
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 26px;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,255,255,.3), rgba(200,169,110,.6) 60%, rgba(180,140,255,.4));
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(200,169,110,.4);
  }
  .scroll-roll::before { left: -7px; }
  .scroll-roll::after { right: -7px; }

  /* ===== 头部 ===== */
  .scroll-header {
    position: relative;
    padding: 12px 24px 10px;
    border-bottom: 1px solid rgba(200,169,110,.12);
    background: linear-gradient(135deg, rgba(200,169,110,.05) 0%, transparent 60%);
  }
  /* 角落装饰纹 */
  .scroll-header::before {
    content: '❋';
    position: absolute;
    top: 12px; left: 20px;
    font-size: .7rem;
    color: rgba(200,169,110,.25);
    letter-spacing: .1em;
  }
  .scroll-header::after {
    content: '❋';
    position: absolute;
    top: 12px; right: 60px;
    font-size: .7rem;
    color: rgba(200,169,110,.25);
    letter-spacing: .1em;
  }

  .scroll-close {
    position: absolute;
    top: 16px; right: 20px;
    width: 36px; height: 36px;
    border: 1px solid rgba(200,169,110,.3);
    border-radius: 50%;
    background: rgba(200,169,110,.05);
    color: rgba(200,169,110,.7);
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .35s cubic-bezier(.4,0,.2,1);
    z-index: 5;
  }
  .scroll-close:hover { 
    background: rgba(200,169,110,.15); 
    color: var(--accent); 
    border-color: var(--accent);
    transform: rotate(90deg) scale(1.05);
    box-shadow: 0 0 16px rgba(200,169,110,.2);
  }
  .scroll-icon-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .scroll-icon { font-size: 2.6rem; line-height: 1; }
  .scroll-season-bar {
    flex: 1;
    height: 2px;
    background: linear-gradient(to right, var(--accent), transparent);
    opacity: .4;
    border-radius: 1px;
  }
  .scroll-name-row {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .scroll-name { 
    font-size: clamp(2.2rem, 6vw, 2.8rem); 
    font-weight: 900; 
    letter-spacing: .12em; 
    line-height: 1.1;
    background: linear-gradient(135deg, var(--accent) 0%, rgba(200,169,110,.6) 50%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(200,169,110,.3));
  }
  .scroll-date {
    display: inline-block;
    font-size: .78rem;
    padding: 5px 14px;
    border-radius: 20px;
    border: 1px solid currentColor;
    letter-spacing: .15em;
    opacity: .8;
    white-space: nowrap;
  }
  .scroll-poem {
    margin-top: 14px;
    padding: 14px 18px;
    border-left: 2.5px solid var(--accent);
    background: linear-gradient(135deg, rgba(200,169,110,.06) 0%, transparent 70%);
    border-radius: 0 10px 10px 0;
    text-align: left;
    position: relative;
  }
  .scroll-poem::before {
    content: '"';
    position: absolute;
    top: -8px; left: 16px;
    font-size: 3rem;
    color: rgba(200,169,110,.15);
    font-family: serif;
    line-height: 1;
  }
  .scroll-poem-text { font-size: 1.05rem; line-height: 2; letter-spacing: .06em; color: rgba(240,232,216,.9); }
  .scroll-poem-source { font-size: .72rem; opacity: .55; margin-top: 10px; text-align: right; letter-spacing: .1em; }

  /* ===== 内容区 ===== */
  .scroll-body { padding: 12px 24px 16px; }

  /* ===== 标签页 ===== */
  .scroll-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    padding: 4px;
    background: rgba(200,169,110,.04);
    border-radius: 30px;
    border: 1px solid rgba(200,169,110,.1);
  }
  .scroll-tab {
    flex: 1;
    padding: 10px 12px;
    font-size: .78rem;
    letter-spacing: .15em;
    cursor: pointer;
    border-radius: 26px;
    border: none;
    background: transparent;
    color: rgba(200,169,110,.5);
    transition: all .35s cubic-bezier(.4,0,.2,1);
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .scroll-tab::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--accent), rgba(200,169,110,.7));
    opacity: 0;
    transform: scaleX(0);
    transition: all .35s cubic-bezier(.4,0,.2,1);
    border-radius: inherit;
  }
  .scroll-tab.active { 
    color: #0e0828;
    font-weight: 700;
    box-shadow: 0 2px 12px rgba(200,169,110,.3);
  }
  .scroll-tab.active::before { opacity: 1; transform: scaleX(1); }
  .scroll-tab span { position: relative; z-index: 1; }
  .scroll-tab:hover:not(.active) { 
    color: rgba(200,169,110,.9);
    background: rgba(200,169,110,.06);
  }

  .scroll-panel { display: none; opacity: 0; transform: translateY(12px); }
  .scroll-panel.active { 
    display: block; 
    animation: panelReveal .4s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes panelReveal {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== 详情卡片网格 ===== */
  .scroll-detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .scroll-detail-item {
    padding: 12px 14px;
    border-radius: 14px;
    background: rgba(200,169,110,.03);
    border: 1px solid rgba(200,169,110,.1);
    transition: all .35s cubic-bezier(.4,0,.2,1);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(8px);
    animation: itemReveal .35s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes itemReveal {
    to { opacity: 1; transform: translateY(0); }
  }
  .scroll-detail-item:nth-child(1) { animation-delay: 0ms; }
  .scroll-detail-item:nth-child(2) { animation-delay: 60ms; }
  .scroll-detail-item:nth-child(3) { animation-delay: 120ms; }
  .scroll-detail-item:nth-child(4) { animation-delay: 180ms; }
  .scroll-detail-item::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: linear-gradient(to bottom, var(--accent), transparent);
    opacity: .4;
    transition: opacity .3s;
  }
  .scroll-detail-item:hover { 
    border-color: rgba(200,169,110,.28);
    background: rgba(200,169,110,.06);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(180,140,255,.1);
  }
  .scroll-detail-item:hover::before { opacity: .8; }
  .scroll-detail-label { 
    font-size: .62rem; 
    letter-spacing: .2em; 
    opacity: .5; 
    margin-bottom: 8px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .scroll-detail-label::before {
    content: '◈';
    font-size: .5rem;
    opacity: .7;
  }
  .scroll-detail-value { font-size: .88rem; line-height: 1.8; letter-spacing: .03em; color: rgba(240,232,216,.88); }

  /* 文本内容样式 */
  .scroll-text-content {
    font-size: .9rem;
    line-height: 1.9;
    letter-spacing: .04em;
    color: rgba(240,232,216,.85);
    padding: 8px 0;
    animation: fadeUp .4s ease forwards;
  }

  /* ===== 壁纸生成区域 ===== */
  .wallpaper-section {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px dashed rgba(200,169,110,.15);
  }
  .wallpaper-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .wallpaper-divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(200,169,110,.3), transparent);
  }
  .wallpaper-divider-text {
    font-size: .7rem;
    letter-spacing: .2em;
    color: rgba(200,169,110,.6);
    white-space: nowrap;
  }
  
  /* 尺寸选择器 */
  .wallpaper-size-selector {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .wallpaper-size-label {
    font-size: .72rem;
    color: rgba(200,169,110,.7);
    letter-spacing: .1em;
  }
  .wallpaper-size-options {
    display: flex;
    gap: 10px;
  }
  .wallpaper-size-option input {
    display: none;
  }
  .wallpaper-size-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 16px;
    border: 1px solid rgba(200,169,110,.2);
    border-radius: 12px;
    background: rgba(200,169,110,.03);
    cursor: pointer;
    transition: all .3s ease;
  }
  .wallpaper-size-option input:checked + .wallpaper-size-card {
    border-color: var(--accent);
    background: rgba(200,169,110,.1);
    box-shadow: 0 0 12px rgba(200,169,110,.2);
  }
  .wallpaper-size-card:hover {
    border-color: rgba(200,169,110,.4);
    background: rgba(200,169,110,.06);
  }
  .wallpaper-size-icon { font-size: 1.4rem; }
  .wallpaper-size-text {
    font-size: .7rem;
    color: rgba(200,169,110,.8);
    letter-spacing: .08em;
  }
  .wallpaper-size-ratio {
    font-size: .6rem;
    color: rgba(200,169,110,.5);
    letter-spacing: .05em;
  }
  
  .wallpaper-actions {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }
  .wallpaper-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    border: 1px solid rgba(200,169,110,.4);
    border-radius: 30px;
    background: linear-gradient(135deg, rgba(200,169,110,.08) 0%, rgba(200,169,110,.03) 100%);
    color: var(--accent);
    font-family: inherit;
    font-size: .82rem;
    letter-spacing: .1em;
    cursor: pointer;
    transition: all .4s cubic-bezier(.4,0,.2,1);
  }
  .wallpaper-btn:hover {
    background: linear-gradient(135deg, rgba(200,169,110,.15) 0%, rgba(200,169,110,.08) 100%);

function getCurrentJieqi() {
  const now = new Date();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const ranges = [
    [1,20,'大寒'],[2,4,'立春'],[2,19,'雨水'],[3,6,'惊蛰'],[3,21,'春分'],
    [4,5,'清明'],[4,20,'谷雨'],[5,6,'立夏'],[5,21,'小满'],[6,6,'芒种'],
    [6,21,'夏至'],[7,7,'小暑'],[7,23,'大暑'],[8,7,'立秋'],[8,23,'处暑'],
    [9,8,'白露'],[9,23,'秋分'],[10,8,'寒露'],[10,23,'霜降'],[11,7,'立冬'],
    [11,22,'小雪'],[12,7,'大雪'],[12,22,'冬至'],[12,31,'小寒']
  ];
  let cur = '大寒';
  for(const [rm,rd,name] of ranges) {
    if(m > rm || (m===rm && d>=rd)) cur = name;
  }
  return cur;
}

// ============================================================
//  粒子系统
// ============================================================
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];
let mouse = { x: -1000, y: -1000 };

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 1.5 + 0.3;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.life = 0;
    this.maxLife = Math.random() * 300 + 200;
    const colors = ['200,169,110', '240,232,216', '180,200,255', '86,204,242'];
    this.color = colors[Math.floor(Math.random() * colors.length)];
  }
  update() {
    const dx = this.x - mouse.x;
    const dy = this.y - mouse.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(dist < 120) {
      const force = (120 - dist) / 120 * 0.8;
      this.vx += (dx/dist) * force;
      this.vy += (dy/dist) * force;
    }
    this.vx *= 0.98; this.vy *= 0.98;
    this.x += this.vx; this.y += this.vy;
    this.life++;
    if(this.life > this.maxLife || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
  }
  draw() {
    const alpha = Math.min(this.life/60, 1 - this.life/this.maxLife) * 0.6;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${this.color},${alpha})`;
    ctx.fill();
  }
}

function initParticles() {
  particles = Array.from({length: 50}, () => new Particle());
}
function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for(let i = 0; i < particles.length; i++) {
    particles[i].update(); particles[i].draw();
    for(let j = i+1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const d = Math.sqrt(dx*dx+dy*dy);
      if(d < 80) {
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(139,115,85,${(1-d/80)*0.08})`;
        ctx.lineWidth = 0.5; ctx.stroke();
      }
    }
  }
  requestAnimationFrame(animateParticles);
}
resizeCanvas(); initParticles(); animateParticles();
window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });

function createInkBlob(x, y, color = '200,169,110') {
  const blob = document.createElement('div');
  blob.className = 'ink-blob';
  blob.style.cssText = `
    left: ${x}px;
    top: ${y}px;
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, rgba(${color},0.6) 0%, transparent 70%);
  `;
  document.body.appendChild(blob);
  setTimeout(() => blob.remove(), 1200);
}

// ============================================================
//  量子纠缠效果
// ============================================================
function createEntangleEffect(x, y) {
  const container = document.getElementById('entangle-container');
  
  for(let i = 0; i < 3; i++) {
    setTimeout(() => {
      const line = document.createElement('div');
      line.className = 'entangle-line';
      const angle = Math.random() * Math.PI * 2;
      const len = 50 + Math.random() * 80;
      const endX = x + Math.cos(angle) * len;
      const endY = y + Math.sin(angle) * len;
      
      line.style.cssText = `
        left: ${x}px;
        top: ${y}px;
        width: ${len}px;
        transform-origin: 0 50%;
        transform: rotate(${angle}rad);
      `;
      container.appendChild(line);
      setTimeout(() => line.remove(), 2000);
    }, i * 100);
  }
}

// ============================================================
//  涟漪效果
// ============================================================
function createRipple(e, el) {
  const rect = el.getBoundingClientRect();
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  ripple.style.cssText = `
    width: ${size}px;
    height: ${size}px;
    left: ${e.clientX - rect.left - size/2}px;
    top: ${e.clientY - rect.top - size/2}px;
  `;
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 800);
}

//  节气罗盘
// ============================================================
function buildCompass() {
  const svg = document.getElementById('compass-svg');
  const cx = 230, cy = 230, r1 = 190, r2 = 145, r3 = 100;
  const currentName = getCurrentJieqi();
  let html = '';

  const seasons = [
    { color:'#6fcf97', start:0, end:6 },{ color:'#eb5757', start:6, end:12 },
    { color:'#f2994a', start:12, end:18 },{ color:'#56ccf2', start:18, end:24 }
  ];
  seasons.forEach(s => {
    const a1=(s.start/24)*360-90, a2=(s.end/24)*360-90;
    const x1=cx+r1*Math.cos(a1*Math.PI/180), y1=cy+r1*Math.sin(a1*Math.PI/180);
    const x2=cx+r1*Math.cos(a2*Math.PI/180), y2=cy+r1*Math.sin(a2*Math.PI/180);
    html += `<path d="M${cx},${cy} L${x1},${y1} A${r1},${r1} 0 0,1 ${x2},${y2} Z" fill="${s.color}" opacity="0.04"/>`;
  });
  [r1,r2,r3,55].forEach(r => {
    html += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(200,169,110,0.15)" stroke-width="1"/>`;
  });

  JIEQI.forEach((jq, i) => {
    const angle = (i/24)*360-90, rad = angle*Math.PI/180;
    const isCurrent = jq.name === currentName;
    const lx1=cx+r2*Math.cos(rad), ly1=cy+r2*Math.sin(rad);
    const lx2=cx+(r2+18)*Math.cos(rad), ly2=cy+(r2+18)*Math.sin(rad);
    const tr=r1+10, tx=cx+tr*Math.cos(rad), ty=cy+tr*Math.sin(rad);
    const rotate=angle+90;
    const ir=r3-10, ix=cx+ir*Math.cos(rad), iy=cy+ir*Math.sin(rad);
    const hitR=r2+25, hx=cx+hitR*Math.cos(rad), hy=cy+hitR*Math.sin(rad);

    html += `<g class="compass-node" data-name="${jq.name}" style="cursor:pointer">
      <circle cx="${hx}" cy="${hy}" r="18" fill="transparent"/>
      <line x1="${lx1}" y1="${ly1}" x2="${lx2}" y2="${ly2}" stroke="${isCurrent?'var(--accent)':'rgba(200,169,110,0.35)'}" stroke-width="${isCurrent?2:1}"/>
      <text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle"
        font-size="${isCurrent?13:10}" fill="${isCurrent?'var(--accent)':'rgba(240,232,216,0.6)'}"
        font-family="'Noto Serif SC','STSong',serif" font-weight="${isCurrent?700:400}"
        transform="rotate(${rotate},${tx},${ty})">${jq.name}</text>
      <text x="${ix}" y="${iy}" text-anchor="middle" dominant-baseline="middle" font-size="11">${jq.icon}</text>
      ${isCurrent ? `<circle cx="${cx+(r2+8)*Math.cos(rad)}" cy="${cy+(r2+8)*Math.sin(rad)}" r="5" fill="var(--accent)" opacity="0.9"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2s" repeatCount="indefinite"/><animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/></circle>` : ''}
    </g>`;
  });

  html += `<circle cx="${cx}" cy="${cy}" r="52" fill="rgba(20,11,58,0.9)" stroke="rgba(180,140,255,0.35)" stroke-width="1"/>
    <text x="${cx}" y="${cy-10}" text-anchor="middle" font-size="18" fill="var(--accent)" font-family="'STKaiti','KaiTi',serif">节气</text>
    <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="rgba(180,140,255,0.6)" letter-spacing="2">TIME WHEEL</text>`;

  const curIdx = JIEQI.findIndex(j => j.name === currentName);
  if(curIdx >= 0) {
    const pAngle=(curIdx/24)*360-90, pRad=pAngle*Math.PI/180;
    const px=cx+(r3-5)*Math.cos(pRad), py=cy+(r3-5)*Math.sin(pRad);
    html += `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>`;
    html += `<circle cx="${cx}" cy="${cy}" r="4" fill="var(--accent)"/>`;
  }
  svg.innerHTML = html;

  svg.querySelectorAll('.compass-node').forEach(node => {
    node.addEventListener('click', (e) => {
      const jq = JIEQI.find(j => j.name === node.dataset.name);
      if(jq) {
        createInkBlob(e.clientX, e.clientY, SEASON_COLOR[jq.season].replace('#','').match(/.{2}/g).map(x=>parseInt(x,16)).join(','));
        createEntangleEffect(e.clientX, e.clientY);
        openScrollModal(jq);
      }
    });
  });
}
buildCompass();

function openScrollModal(jq) {
  const color = SEASON_COLOR[jq.season];
  const overlay = document.getElementById('scroll-overlay');
  const header = document.getElementById('scroll-header');
  
  header.style.borderBottomColor = color + '20';
  document.getElementById('scroll-icon').textContent = jq.icon;
  const nameEl = document.getElementById('scroll-name');
  nameEl.textContent = jq.name;
  nameEl.style.background = `linear-gradient(135deg, ${color} 0%, rgba(200,169,110,.7) 50%, ${color} 100%)`;
  nameEl.style.webkitBackgroundClip = 'text';
  nameEl.style.webkitTextFillColor = 'transparent';
  nameEl.style.backgroundClip = 'text';
  
  const dateEl = document.getElementById('scroll-date');
  dateEl.textContent = jq.date;
  dateEl.style.color = color;
  dateEl.style.borderColor = color;
  
  document.getElementById('scroll-poem-text').textContent = jq.poem;
  document.getElementById('scroll-poem-source').textContent = '—— ' + jq.poet;
  document.getElementById('scroll-poem').style.borderLeftColor = color;

  // 填充面板
  const panels = [
    { id:'scroll-panel-0', type:'text', data: jq.meaning },
    { id:'scroll-panel-1', labels:['初候','二候','三候'], data: jq.phenology },
    { id:'scroll-panel-2', labels:['农事一','农事二','农事三'], data: jq.farming },
    { id:'scroll-panel-3', labels:['养生一','养生二','养生三'], data: jq.health },
    { id:'scroll-panel-4', type:'text', data: jq.story || '暂无相关故事传说' },
  ];
  
  panels.forEach(p => {
    const container = document.getElementById(p.id);
    container.innerHTML = '';
    if (p.type === 'text') {
      container.innerHTML = `<div class="scroll-text-content">${p.data}</div>`;
    } else {
      p.data.forEach((val, i) => {
        container.innerHTML += `<div class="scroll-detail-item">
          <div class="scroll-detail-label">${p.labels[i]}</div>
          <div class="scroll-detail-value">${val}</div>
        </div>`;
      });
    }
  });

  // 重置标签页
  document.querySelectorAll('.scroll-tab').forEach((t,i) => {
    t.classList.toggle('active', i===0);
  });
  document.querySelectorAll('.scroll-panel').forEach((p,i) => p.classList.toggle('active', i===0));
  
  // 重置壁纸区域
  currentWallpaperData = null;
  document.getElementById('wallpaper-preview').innerHTML = `
    <div class="wallpaper-placeholder">
      <span class="wallpaper-placeholder-icon">🖼️</span>
      <span class="wallpaper-placeholder-text">点击上方按钮<br>生成专属节气壁纸</span>
    </div>
  `;
  const genBtn = document.getElementById('generate-wallpaper');
  genBtn.classList.remove('loading');
  genBtn.innerHTML = '<span class="wallpaper-btn-icon">🎨</span><span class="wallpaper-btn-text">一键生成壁纸</span>';

  overlay.classList.add('open');
}

});

// 动态效果配置
const DYNAMIC_EFFECTS = {
  spring: { type: 'petal', icon: '🌸', particleCount: 15 },
  summer: { type: 'firefly', icon: '✨', particleCount: 20 },
  autumn: { type: 'leaf', icon: '🍂', particleCount: 12 },

};

// 生成动态效果HTML
function generateDynamicEffect(season, preview) {
  const effect = DYNAMIC_EFFECTS[season] || DYNAMIC_EFFECTS.spring;
  const effectsContainer = document.createElement('div');
  effectsContainer.className = 'wallpaper-effects';
  
  // 根据季节生成不同的动态效果
  switch(effect.type) {
    case 'snow':
      for(let i = 0; i < effect.particleCount; i++) {
        const flake = document.createElement('span');
        flake.className = 'wallpaper-snowflake';
        flake.textContent = '❄';
        flake.style.cssText = `
          left: ${Math.random() * 100}%;
          --size: ${6 + Math.random() * 10}px;
          --duration: ${4 + Math.random() * 6}s;
          --delay: ${Math.random() * 5}s;
          --max-opacity: ${0.3 + Math.random() * 0.4};
          --fall-distance: 200px;
        `;
        effectsContainer.appendChild(flake);
      }
      break;
      
    case 'petal':
      const petalColors = ['rgba(255,182,193,', 'rgba(255,218,185,', 'rgba(255,192,203,'];
      for(let i = 0; i < effect.particleCount; i++) {
        const petal = document.createElement('div');
        petal.className = 'wallpaper-petal';
        const color = petalColors[Math.floor(Math.random() * petalColors.length)];
        petal.style.cssText = `
          left: ${Math.random() * 100}%;
          top: -20px;
          --size: ${8 + Math.random() * 12}px;
          --petal-color: ${color}0.6);
          --duration: ${6 + Math.random() * 8}s;
          --delay: ${Math.random() * 8}s;
          --max-opacity: ${0.4 + Math.random() * 0.3};
          --fall-distance: ${150 + Math.random() * 100}px;
        `;
        effectsContainer.appendChild(petal);
      }
      break;
      
    case 'leaf':
      const leafColors = ['rgba(210,105,30,', 'rgba(255,140,0,', 'rgba(205,92,0,', 'rgba(244,164,96,'];
      for(let i = 0; i < effect.particleCount; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'wallpaper-particle';
        const color = leafColors[Math.floor(Math.random() * leafColors.length)];
        leaf.style.cssText = `
          left: ${Math.random() * 100}%;
          width: ${8 + Math.random() * 10}px;
          height: ${8 + Math.random() * 10}px;
          background: ${color}0.7);
          border-radius: 50% 0 50% 0;
          --duration: ${8 + Math.random() * 6}s;
          --delay: ${Math.random() * 10}s;
          --max-opacity: ${0.5 + Math.random() * 0.3};
        `;
        effectsContainer.appendChild(leaf);
      }
      break;
      
    case 'firefly':
      const glowColors = ['rgba(255,255,150,', 'rgba(200,255,150,', 'rgba(150,255,200,'];
      for(let i = 0; i < effect.particleCount; i++) {
        const firefly = document.createElement('div');
        firefly.className = 'wallpaper-firefly';
        const color = glowColors[Math.floor(Math.random() * glowColors.length)];
        firefly.style.cssText = `
          left: ${10 + Math.random() * 80}%;
          top: ${10 + Math.random() * 60}%;
          --size: ${4 + Math.random() * 6}px;
          --glow-color: ${color}0.8);
          --duration: ${3 + Math.random() * 4}s;
          --delay: ${Math.random() * 5}s;
          --max-opacity: ${0.6 + Math.random() * 0.4};
          --drift-x: ${-30 + Math.random() * 60}px;
          --drift-y: ${-30 + Math.random() * 60}px;
        `;
        effectsContainer.appendChild(firefly);
      }
      break;

  // 添加星光点缀（所有季节都有）
  for(let i = 0; i < 8; i++) {

      --size: ${2 + Math.random() * 3}px;
      --duration: ${2 + Math.random() * 3}s;
      --delay: ${Math.random() * 4}s;
      --max-opacity: ${0.4 + Math.random() * 0.4};
    `;
    effectsContainer.appendChild(star);
  }
  
  return effectsContainer;
}

// 壁纸生成按钮点击事件

  // 获取选择的尺寸

  // 显示加载状态
  btn.classList.add('loading');
  btn.innerHTML = '<span class="wallpaper-btn-icon">⏳</span><span class="wallpaper-btn-text">生成中...</span>';
  preview.innerHTML = `
    <div class="wallpaper-loading">
      <div class="wallpaper-loading-spinner"></div>
      <div class="wallpaper-loading-text">正在为您创作壁纸...</div>
    </div>
  `;
  
  try {
    // 调用AI生成壁纸
    const prompt = generateWallpaperPrompt(jq, sizeType);
    const sizeConfig = sizeType === 'mobile' 
      ? { size: "1024x1792", canvasW: 1080, canvasH: 1920 }
      : { size: "1792x1024", canvasW: 1920, canvasH: 1080 };
    
    const result = await image_gen({
      n: 1,
      prompt: `${prompt}，高清细腻，中国传统水墨风格，${sizeConfig.size}，背景渐变暗色调，中心留白区域用于显示节气信息`,
      quality: "high",
      size: sizeConfig.size,
      style: "vivid"
    });
    
    if (result && result.length > 0) {
      const imageUrl = result[0];
      currentWallpaperData = { url: imageUrl, name: jq.name, date: jq.date, sizeType };
      
      // 显示生成的壁纸（带动态效果预览）
      preview.innerHTML = `
        <div class="wallpaper-dynamic">
          <img src="${imageUrl}" alt="${jq.name}壁纸" crossorigin="anonymous">
          ${generateDynamicEffect(jq.season, preview).outerHTML}
        </div>
        <button class="wallpaper-download-btn" onclick="downloadWallpaper()">⬇ 下载壁纸</button>
      `;
    }
  } catch (error) {
    console.error('壁纸生成失败:', error);
    // 生成失败时使用Canvas备用方案
    generateFallbackWallpaper(jq, sizeType);
  }
  
  // 恢复按钮状态
  btn.classList.remove('loading');
  btn.innerHTML = '<span class="wallpaper-btn-icon">🎨</span><span class="wallpaper-btn-text">重新生成</span>';
});

// Canvas精美壁纸生成
function generateFallbackWallpaper(jq, sizeType = 'mobile') {
  const preview = document.getElementById('wallpaper-preview');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  
  // 根据尺寸类型设置画布
  const isMobile = sizeType === 'mobile';
  canvas.width = isMobile ? 1080 : 1920;
  canvas.height = isMobile ? 1920 : 1080;
  
  // 四季精美配色方案
  const seasonThemes = {
    spring: {
      bg1: '#0d2818', bg2: '#1a4d2e', bg3: '#2d5a3d',
      accent: '#ff9eb5', gold: '#c8a96e',
      particle: ['rgba(255,182,193,0.6)', 'rgba(255,218,185,0.5)', 'rgba(255,192,203,0.4)'],
      glow: 'rgba(111,207,151,0.3)'
    },
    summer: {
      bg1: '#1a0a28', bg2: '#2d1050', bg3: '#4a1870',
      accent: '#fff5a0', gold: '#c8a96e',
      particle: ['rgba(255,255,150,0.6)', 'rgba(200,255,200,0.4)', 'rgba(150,200,255,0.3)'],
      glow: 'rgba(235,87,87,0.3)'
    },
    autumn: {
      bg1: '#1a1005', bg2: '#3a2008', bg3: '#5a3510',
      accent: '#ffb347', gold: '#c8a96e',
      particle: ['rgba(210,105,30,0.7)', 'rgba(255,140,0,0.5)', 'rgba(205,92,0,0.4)'],
      glow: 'rgba(242,153,74,0.3)'
    },
    winter: {
      bg1: '#0a1020', bg2: '#1a2a4a', bg3: '#2a3a5a',
      accent: '#a0d8ff', gold: '#c8a96e',
      particle: ['rgba(200,220,255,0.8)', 'rgba(150,180,255,0.5)', 'rgba(255,255,255,0.3)'],
      glow: 'rgba(86,204,242,0.3)'
    }
  };
  
  const theme = seasonThemes[jq.season] || seasonThemes.spring;
  
  // 创建精美渐变背景
  const bgGradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  bgGradient.addColorStop(0, theme.bg1);
  bgGradient.addColorStop(0.5, theme.bg2);
  bgGradient.addColorStop(1, theme.bg3);
  ctx.fillStyle = bgGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // 添加光晕效果
  const glowX = canvas.width * 0.5;
  const glowY = canvas.height * (isMobile ? 0.25 : 0.4);
  const glowRadius = Math.min(canvas.width, canvas.height) * 0.5;
  const glowGradient = ctx.createRadialGradient(glowX, glowY, 0, glowX, glowY, glowRadius);
  glowGradient.addColorStop(0, theme.glow);
  glowGradient.addColorStop(1, 'transparent');
  ctx.fillStyle = glowGradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // 绘制装饰性圆环（金色光圈）
  const centerX = canvas.width / 2;
  const centerY = canvas.height * (isMobile ? 0.32 : 0.45);
  const ringRadius = Math.min(canvas.width, canvas.height) * 0.28;
  
  // 外圈装饰
  ctx.strokeStyle = 'rgba(200,169,110,0.08)';
  ctx.lineWidth = 2;
  for(let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.arc(centerX, centerY, ringRadius + i * 30, 0, Math.PI * 2);
    ctx.stroke();
  }
  
  // 内圈装饰（虚线）
  ctx.setLineDash([5, 10]);
  ctx.strokeStyle = 'rgba(200,169,110,0.12)';
  ctx.beginPath();
  ctx.arc(centerX, centerY, ringRadius - 20, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);
  
  // 添加角落装饰纹样
  const cornerSize = 60;
  ctx.strokeStyle = 'rgba(200,169,110,0.1)';
  ctx.lineWidth = 1;
  // 左上角
  ctx.beginPath();
  ctx.moveTo(30, cornerSize);
  ctx.lineTo(30, 30);
  ctx.lineTo(cornerSize, 30);
  ctx.stroke();
  // 右上角
  ctx.beginPath();
  ctx.moveTo(canvas.width - 30, cornerSize);
  ctx.lineTo(canvas.width - 30, 30);
  ctx.lineTo(canvas.width - cornerSize, 30);
  ctx.stroke();
  
  // 节气图标（大号，带光晕）
  ctx.font = `${isMobile ? 140 : 120}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // 图标光晕
  ctx.shadowColor = theme.accent;
  ctx.shadowBlur = 40;
  ctx.fillText(jq.icon, centerX, centerY - 20);
  ctx.shadowBlur = 0;
  
  // 节气名称（渐变色文字）
  const nameGradient = ctx.createLinearGradient(centerX - 200, 0, centerX + 200, 0);
  nameGradient.addColorStop(0, theme.accent);
  nameGradient.addColorStop(0.5, theme.gold);
  nameGradient.addColorStop(1, theme.accent);
  ctx.font = `bold ${isMobile ? 110 : 90}px "STKaiti", "KaiTi", serif`;
  ctx.fillStyle = nameGradient;
  ctx.shadowColor = 'rgba(200,169,110,0.5)';
  ctx.shadowBlur = 20;
  ctx.fillText(jq.name, centerX, centerY + (isMobile ? 200 : 160));
  ctx.shadowBlur = 0;
  
  // 日期标签
  const dateY = centerY + (isMobile ? 280 : 230);
  ctx.fillStyle = 'rgba(200,169,110,0.15)';
  ctx.beginPath();
  const dateWidth = isMobile ? 140 : 120;
  ctx.roundRect(centerX - dateWidth/2, dateY - 22, dateWidth, 40, 20);
  ctx.fill();
  ctx.strokeStyle = 'rgba(200,169,110,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.font = `${isMobile ? 32 : 28}px "STKaiti", "KaiTi", serif`;
  ctx.fillStyle = theme.gold;
  ctx.fillText(jq.date, centerX, dateY + 5);
  
  // 精美分隔线（带装饰）
  const lineY = centerY + (isMobile ? 380 : 320);
  ctx.strokeStyle = 'rgba(200,169,110,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(centerX - 150, lineY);
  ctx.lineTo(centerX - 30, lineY);
  ctx.stroke();
  ctx.font = '20px serif';
  ctx.fillStyle = 'rgba(200,169,110,0.5)';
  ctx.fillText('✦', centerX, lineY + 6);
  ctx.beginPath();
  ctx.moveTo(centerX + 30, lineY);
  ctx.lineTo(centerX + 150, lineY);
  ctx.stroke();
  
  // 诗词名句（带引号装饰）
  const poemY = centerY + (isMobile ? 460 : 400);
  ctx.font = `${isMobile ? 36 : 30}px "STKaiti", "KaiTi", serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  // 左引号
  ctx.font = '48px serif';
  ctx.fillStyle = 'rgba(200,169,110,0.3)';
  ctx.fillText('"', centerX - (isMobile ? 160 : 200), poemY - 30);
  // 诗句
  ctx.font = `${isMobile ? 36 : 30}px "STKaiti", "KaiTi", serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const poemText = jq.poem.length > 18 ? jq.poem.substring(0, 18) + '...' : jq.poem;
  ctx.fillText(poemText, centerX, poemY);
  // 右引号
  ctx.font = '48px serif';
  ctx.fillStyle = 'rgba(200,169,110,0.3)';
  ctx.fillText('"', centerX + (isMobile ? 160 : 200), poemY + 30);
  
  // 诗词出处
  ctx.font = `${isMobile ? 26 : 22}px "STKaiti", "KaiTi", serif`;
  ctx.fillStyle = 'rgba(200,169,110,0.6)';
  ctx.fillText('—— ' + jq.poet, centerX, poemY + (isMobile ? 60 : 50));
  
  // 底部水印（精美设计）
  const watermarkY = canvas.height - (isMobile ? 100 : 70);
  ctx.font = `${isMobile ? 24 : 20}px serif`;
  ctx.fillStyle = 'rgba(200,169,110,0.25)';
  ctx.fillText('· 廿四节气 · 时令诗境 ·', centerX, watermarkY);
  
  // 添加底部装饰线
  ctx.strokeStyle = 'rgba(200,169,110,0.1)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(centerX - 100, watermarkY + 30);
  ctx.lineTo(centerX - 20, watermarkY + 30);
  ctx.stroke();
  ctx.fillStyle = 'rgba(200,169,110,0.2)';
  ctx.font = '16px serif';
  ctx.fillText('☯', centerX, watermarkY + 34);
  ctx.beginPath();
  ctx.moveTo(centerX + 20, watermarkY + 30);
  ctx.lineTo(centerX + 100, watermarkY + 30);
  ctx.stroke();
  
  // 生成图片并显示
  const dataUrl = canvas.toDataURL('image/png');
  currentWallpaperData = { url: dataUrl, name: jq.name, date: jq.date, sizeType };
  
  preview.innerHTML = `
    <div class="wallpaper-dynamic">
      <img src="${dataUrl}" alt="${jq.name}壁纸">
      ${generateDynamicEffect(jq.season, preview).outerHTML}
    </div>
    <button class="wallpaper-download-btn" onclick="downloadWallpaper()">⬇ 下载壁纸</button>
  `;
}

// 下载壁纸
function downloadWallpaper() {
  if (!currentWallpaperData) return;
  
  const link = document.createElement('a');
  link.href = currentWallpaperData.url;
  const sizeLabel = currentWallpaperData.sizeType === 'mobile' ? '手机' : '电脑';
  link.download = `节气壁纸_${currentWallpaperData.name}_${sizeLabel}端_${currentWallpaperData.date}.png`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// ============================================================
//  滚动进度条 & 视差
// ============================================================
window.addEventListener('scroll', () => {
  const y = window.scrollY;
  const progress = (y / (document.body.scrollHeight - window.innerHeight)) * 100;
  document.getElementById('progress-bar').style.width = progress + '%';
  
  // 装饰圆环视差
  document.querySelectorAll('.deco-ring').forEach((el, i) => {
    el.style.transform = `scale(${1 + i*0.05}) translateY(${y * (0.05 + i*0.03)}px)`;
  });
  
  // 浮动字符视差
  document.querySelectorAll('.float-char').forEach((el, i) => {
    el.style.transform = `translateY(${y * 0.1 * (i%2 ? 1 : -1)}px)`;
  });
});

// ============================================================
//  Reveal 动画
// ============================================================
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting) entry.target.classList.add('visible');
  });
}, { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
</script>
