<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时令诗境 · 廿四节气</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=ZCOOL+XiaoWei&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --gold:#D4B96E;--gold-light:#E8D5A0;--gold-dim:#9E8A50;
  --purple-deep:#0D0A1F;--purple-mid:#1A1436;--purple-soft:#2A2050;
  --text-white:rgba(255,255,255,0.92);--text-dim:rgba(255,255,255,0.5);
  --text-muted:rgba(255,255,255,0.3);
  --spring-color:#7EC8A0;--summer-color:#E87040;--autumn-color:#D4A03C;--winter-color:#7AA8D4;
  --current-accent:var(--spring-color);
  --transition:0.8s cubic-bezier(0.4,0,0.2,1);
}

html{scroll-behavior:smooth}
body{
  font-family:'Noto Serif SC','ZCOOL XiaoWei',serif;
  background:var(--purple-deep);color:var(--text-white);
  min-height:100vh;overflow-x:hidden;
}

/* ===== Starfield Canvas ===== */
#starfield{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ===== Nav ===== */
.top-nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;justify-content:space-between;align-items:center;
  padding:20px 40px;pointer-events:none;
}
.top-nav *{pointer-events:auto}
.nav-logo{font-size:14px;color:var(--gold);letter-spacing:0.3em;font-weight:500}
.nav-links{display:flex;gap:28px}
.nav-links a{
  font-size:13px;color:var(--gold-dim);letter-spacing:0.15em;
  text-decoration:none;transition:color 0.3s;cursor:pointer;
}
.nav-links a:hover,.nav-links a.active{color:var(--gold)}

/* ===== Hero ===== */
.hero{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative;z-index:1;
  padding:40px 20px;
}
.hero-orbits{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(80vw,700px);height:min(80vw,700px);pointer-events:none;
}
.orbit-ring{
  position:absolute;border-radius:50%;
  border:1px solid rgba(212,185,110,0.08);
  top:50%;left:50%;transform:translate(-50%,-50%);
}
.orbit-ring:nth-child(1){width:90%;height:90%;animation:orbit-spin 120s linear infinite}
.orbit-ring:nth-child(2){width:70%;height:70%;border-color:rgba(212,185,110,0.05);animation:orbit-spin 90s linear infinite reverse}
.orbit-ring:nth-child(3){width:50%;height:50%;border-color:rgba(212,185,110,0.03);animation:orbit-spin 60s linear infinite}
@keyframes orbit-spin{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}

.hero-content{text-align:center;position:relative;z-index:2}
.hero-title{
  font-size:clamp(42px,8vw,80px);font-weight:900;
  letter-spacing:0.2em;line-height:1.2;
  background:linear-gradient(135deg,var(--gold-light) 0%,var(--gold) 40%,var(--gold-dim) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 30px rgba(212,185,110,0.3));
  margin-bottom:12px;
}
.hero-sub{
  font-size:clamp(13px,2vw,17px);color:var(--gold-dim);
  letter-spacing:0.25em;font-weight:400;margin-bottom:36px;
}
.hero-song{
  font-size:clamp(13px,2vw,16px);color:var(--text-dim);
  line-height:2.2;letter-spacing:0.2em;
  font-family:'ZCOOL XiaoWei',serif;
}
.hero-song span{color:var(--gold-dim);transition:color 0.3s;cursor:default}
.hero-song span:hover{color:var(--gold)}
.hero-countdown{
  margin-top:36px;padding:14px 28px;border-radius:40px;
  background:rgba(212,185,110,0.06);border:1px solid rgba(212,185,110,0.12);
  font-size:clamp(13px,1.8vw,16px);color:var(--text-dim);
  backdrop-filter:blur(10px);
  line-height:1.8;
}
.hero-countdown strong{color:var(--gold);font-size:1.15em}
.hero-countdown .current-term-info{
  font-size:0.85em;color:var(--text-muted);
  margin-top:4px;
}
.hero-countdown .current-term-info em{color:var(--gold-dim);font-style:normal}
.scroll-hint{
  position:absolute;bottom:36px;z-index:2;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  color:var(--gold-dim);font-size:12px;letter-spacing:0.2em;
}
.scroll-line{width:1px;height:40px;background:linear-gradient(to bottom,var(--gold-dim),transparent);animation:scroll-pulse 2s infinite}
@keyframes scroll-pulse{0%,100%{opacity:0.3}50%{opacity:0.8}}

/* ===== Wheel Section ===== */
.wheel-section{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative;z-index:1;
  padding:60px 20px;
}
.wheel-title{
  font-size:clamp(20px,3.5vw,32px);font-weight:700;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;letter-spacing:0.15em;margin-bottom:6px;
}
.wheel-desc{font-size:13px;color:var(--text-dim);letter-spacing:0.1em;margin-bottom:40px}

.wheel-container{
  position:relative;width:min(85vw,640px);height:min(85vw,640px);
  margin:0 auto;
}
.wheel-svg{width:100%;height:100%;overflow:visible}

/* SVG styles */
.wheel-outer-ring{fill:none;stroke:rgba(212,185,110,0.1);stroke-width:1}
.wheel-mid-ring{fill:none;stroke:rgba(212,185,110,0.06);stroke-width:1}
.wheel-inner-ring{fill:none;stroke:rgba(212,185,110,0.03);stroke-width:1}

.wheel-tick{stroke:rgba(212,185,110,0.15);stroke-width:1}
.wheel-tick-major{stroke:rgba(212,185,110,0.3);stroke-width:1.5}

.term-dot{cursor:pointer;transition:all 0.3s}
.term-dot:hover .dot-glow{opacity:0.6}
.term-dot:hover .dot-core{r:7}
.term-dot.active .dot-core{r:9;fill:var(--gold)}
.term-dot.active .dot-glow{opacity:0.8;r:18}
.term-dot.active .dot-label{fill:var(--gold-light);font-weight:700;font-size:12px}
.term-dot.key-selected .dot-core{r:8;fill:var(--gold-light);animation:dot-pulse 1s ease-in-out infinite}
.term-dot.key-selected .dot-glow{opacity:0.7;r:16;fill:rgba(126,200,160,0.4)}
.term-dot.key-selected .dot-label{fill:var(--spring-color);font-weight:700;font-size:11px}

@keyframes dot-pulse{
  0%,100%{r:8}50%{r:11}
}

.dot-glow{fill:rgba(212,185,110,0.15);transition:all 0.3s}
.dot-core{fill:rgba(212,185,110,0.4);transition:all 0.3s}
.dot-label{
  fill:rgba(255,255,255,0.45);font-size:10px;
  font-family:'Noto Serif SC',serif;pointer-events:none;
  transition:all 0.3s;letter-spacing:0.05em;
}

.icon-ring-item{transition:all 0.3s;cursor:pointer}
.icon-ring-item:hover{transform:scale(1.3)}

/* 当前时间指针（细红线，实时转动） */
.wheel-time-needle-group{pointer-events:none}
.wheel-time-needle-line{stroke:rgba(255,80,80,0.85);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:4 3}
.wheel-time-needle-dot{fill:rgba(255,80,80,0.9);filter:drop-shadow(0 0 5px rgba(255,80,80,0.6))}

/* 当前节气指针（金色粗线，固定） */
.wheel-needle-group{transition:transform 1.2s cubic-bezier(0.34,1.56,0.64,1)}
.wheel-needle-line{stroke:var(--gold);stroke-width:2.5;stroke-linecap:round}
.wheel-needle-dot{fill:var(--gold);filter:drop-shadow(0 0 6px rgba(212,185,110,0.5))}

.wheel-center-circle{
  fill:rgba(13,10,31,0.8);stroke:rgba(212,185,110,0.15);stroke-width:1;
  backdrop-filter:blur(10px);
}
.wheel-center-text{
  fill:var(--gold);font-size:28px;font-weight:900;
  font-family:'Noto Serif SC',serif;letter-spacing:0.1em;
  text-anchor:middle;dominant-baseline:middle;transition:fill 0.3s;
}
.wheel-center-text.pulse-text{fill:var(--spring-color);font-size:32px}
.wheel-center-sub{
  fill:var(--text-dim);font-size:10px;letter-spacing:0.2em;
  font-family:'Noto Serif SC',serif;
  text-anchor:middle;dominant-baseline:middle;
}
.wheel-center-time{
  fill:rgba(255,80,80,0.7);font-size:9px;letter-spacing:0.1em;
  font-family:'Noto Serif SC',serif;
  text-anchor:middle;dominant-baseline:middle;
}

/* Season arc colors */
.season-arc{fill:none;stroke-width:30;opacity:0.06}

/* ===== Detail Modal ===== */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity 0.4s;
}
.modal-overlay.show{opacity:1;pointer-events:auto}

.modal{
  position:fixed;top:50%;left:50%;z-index:1000;
  width:min(440px,92vw);max-height:85vh;
  transform:translate(-50%,-50%) scale(0.92);
  background:linear-gradient(170deg,var(--purple-mid),var(--purple-deep));
  border:1px solid rgba(212,185,110,0.12);border-radius:24px;
  opacity:0;pointer-events:none;
  transition:all 0.5s cubic-bezier(0.4,0,0.2,1);
  overflow:hidden;display:flex;flex-direction:column;
}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}

.modal-header{
  padding:28px 28px 0;position:relative;
  display:flex;align-items:flex-start;justify-content:space-between;
}
.modal-term-badge{
  display:flex;align-items:center;gap:12px;
}
.modal-term-icon{
  width:48px;height:48px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:26px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(212,185,110,0.12);
}
.modal-term-info h2{
  font-size:24px;font-weight:900;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;letter-spacing:0.08em;
}
.modal-term-date{
  display:inline-block;margin-top:4px;padding:2px 10px;border-radius:10px;
  font-size:11px;color:var(--text-white);
  background:rgba(232,112,64,0.8);
}
.modal-close{
  width:32px;height:32px;border-radius:50%;border:1px solid rgba(212,185,110,0.15);
  background:transparent;color:var(--gold-dim);font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;flex-shrink:0;
}
.modal-close:hover{background:rgba(212,185,110,0.1);color:var(--gold)}

.modal-poem{
  margin:16px 28px 0;padding:12px 16px;
  border-left:2px solid var(--gold-dim);
  background:rgba(255,255,255,0.02);border-radius:0 10px 10px 0;
}
.modal-poem-text{font-size:14px;color:var(--text-white);line-height:1.8;font-family:'ZCOOL XiaoWei',serif;letter-spacing:0.05em}
.modal-poem-author{font-size:11px;color:var(--text-dim);margin-top:4px}

.modal-tabs{
  display:flex;gap:6px;padding:16px 28px 0;flex-wrap:wrap;
}
.modal-tab{
  padding:7px 16px;border-radius:20px;font-size:12px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);
  color:var(--text-dim);cursor:pointer;transition:all 0.3s;
  letter-spacing:0.05em;
}
.modal-tab.active{
  background:rgba(212,185,110,0.12);border-color:rgba(212,185,110,0.25);
  color:var(--gold-light);
}
.modal-tab:hover:not(.active){background:rgba(255,255,255,0.06);color:var(--text-white)}

.modal-body{
  padding:16px 28px 28px;overflow-y:auto;flex:1;
}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:rgba(212,185,110,0.2);border-radius:4px}

.tab-panel{display:none}
.tab-panel.active{display:block}

.tab-panel p{font-size:14px;line-height:1.9;color:var(--text-dim);margin-bottom:12px}
.tab-panel h4{font-size:13px;color:var(--gold);margin:14px 0 8px;letter-spacing:0.05em}

.wuhou-list{list-style:none;display:flex;flex-direction:column;gap:8px}
.wuhou-item{
  display:flex;gap:12px;align-items:baseline;
  padding:10px 14px;border-radius:12px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);
}
.wuhou-num{font-size:11px;color:var(--gold-dim);font-weight:700;min-width:32px}
.wuhou-text{font-size:13px;color:var(--text-white)}

.custom-tags{display:flex;flex-wrap:wrap;gap:8px}
.custom-tag{
  padding:8px 16px;border-radius:20px;font-size:12px;
  background:rgba(212,185,110,0.06);border:1px solid rgba(212,185,110,0.12);
  color:var(--gold-light);transition:all 0.2s;cursor:default;
}
.custom-tag:hover{background:rgba(212,185,110,0.15)}

.yangsheng-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.yangsheng-item{
  padding:12px 14px;border-radius:12px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);
}
.yangsheng-item strong{font-size:13px;color:var(--gold-dim);display:block;margin-bottom:4px}
.yangsheng-item span{font-size:12px;color:var(--text-dim);line-height:1.7}

.story-text{font-size:14px;color:var(--text-dim);line-height:2;font-family:'ZCOOL XiaoWei',serif}

/* Wallpaper section */
.wallpaper-section{
  margin-top:20px;padding-top:16px;
  border-top:1px solid rgba(212,185,110,0.08);
}
.wallpaper-title{
  text-align:center;font-size:13px;color:var(--gold-dim);
  letter-spacing:0.15em;margin-bottom:12px;
}
.wallpaper-title::before,.wallpaper-title::after{
  content:'◆';font-size:8px;margin:0 8px;vertical-align:middle;
}
.size-options{display:flex;gap:10px;margin-bottom:12px}
.size-option{
  flex:1;padding:14px 10px;border-radius:14px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(212,185,110,0.12);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;transition:all 0.3s;
}
.size-option:hover,.size-option.selected{background:rgba(212,185,110,0.08);border-color:rgba(212,185,110,0.25)}
.size-option .size-icon{font-size:22px}
.size-option .size-label{font-size:11px;color:var(--text-dim)}
.size-option .size-ratio{font-size:10px;color:var(--text-muted)}

.generate-btn{
  width:100%;padding:12px;border-radius:14px;border:none;
  background:linear-gradient(135deg,rgba(212,185,110,0.15),rgba(212,185,110,0.08));
  border:1px solid rgba(212,185,110,0.2);
  color:var(--gold-light);font-size:13px;font-family:'Noto Serif SC',serif;
  cursor:pointer;transition:all 0.3s;letter-spacing:0.1em;
}
.generate-btn:hover{background:linear-gradient(135deg,rgba(212,185,110,0.25),rgba(212,185,110,0.12))}
.generate-btn:active{transform:scale(0.98)}

.wallpaper-preview{
  margin-top:12px;border-radius:12px;overflow:hidden;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.04);
  position:relative;min-height:200px;
  display:flex;align-items:center;justify-content:center;
}
.wallpaper-preview canvas{
  width:100%;height:auto;border-radius:8px;display:block;
}
.wallpaper-preview .wp-placeholder{
  text-align:center;padding:30px;
}
.wallpaper-preview .wp-placeholder p{font-size:12px;color:var(--text-muted);margin-top:8px}
.wallpaper-preview .wp-placeholder .wp-icon{font-size:40px;opacity:0.5}
.wallpaper-download-btn{
  display:none;margin-top:10px;width:100%;padding:10px;border-radius:14px;border:none;
  background:linear-gradient(135deg,rgba(126,200,160,0.15),rgba(126,200,160,0.06));
  border:1px solid rgba(126,200,160,0.2);
  color:#7EC8A0;font-size:13px;font-family:'Noto Serif SC',serif;
  cursor:pointer;transition:all 0.3s;letter-spacing:0.1em;
}
.wallpaper-download-btn.show{display:block}
.wallpaper-download-btn:hover{background:linear-gradient(135deg,rgba(126,200,160,0.25),rgba(126,200,160,0.12))}
.wallpaper-download-btn:active{transform:scale(0.98)}

/* ===== Quiz Floating Button ===== */
.quiz-fab{
  position:fixed;bottom:28px;right:28px;z-index:200;
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,var(--purple-mid),var(--purple-soft));
  border:1.5px solid rgba(212,185,110,0.25);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all 0.3s;
  box-shadow:0 4px 20px rgba(0,0,0,0.3),0 0 12px rgba(212,185,110,0.1);
}
.quiz-fab:hover{
  transform:scale(1.1);
  box-shadow:0 4px 24px rgba(0,0,0,0.4),0 0 20px rgba(212,185,110,0.2);
  border-color:rgba(212,185,110,0.4);
}
.quiz-fab:active{transform:scale(0.95)}
.quiz-fab-icon{font-size:26px;line-height:1}
.quiz-fab-pulse{
  position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;
  border-radius:50%;border:2px solid rgba(212,185,110,0.3);
  animation:fab-pulse 2.5s ease-out infinite;
}
@keyframes fab-pulse{
  0%{transform:scale(1);opacity:0.6}
  100%{transform:scale(1.5);opacity:0}
}

/* ===== Quiz Modal ===== */
.quiz-modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;
  background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity 0.4s;
}
.quiz-modal-overlay.show{opacity:1;pointer-events:auto}

.quiz-modal{
  position:fixed;top:50%;left:50%;z-index:1000;
  width:min(480px,92vw);max-height:85vh;
  transform:translate(-50%,-50%) scale(0.92);
  background:linear-gradient(170deg,var(--purple-mid),var(--purple-deep));
  border:1px solid rgba(212,185,110,0.12);border-radius:24px;
  opacity:0;pointer-events:none;
  transition:all 0.5s cubic-bezier(0.4,0,0.2,1);
  overflow:hidden;display:flex;flex-direction:column;
}
.quiz-modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}

.quiz-modal-header{
  padding:24px 28px 0;display:flex;justify-content:space-between;align-items:center;
}
.quiz-modal-title{font-size:18px;font-weight:700;color:var(--gold-light);letter-spacing:0.1em}
.quiz-modal-close{
  width:32px;height:32px;border-radius:50%;border:1px solid rgba(212,185,110,0.15);
  background:transparent;color:var(--gold-dim);font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
}
.quiz-modal-close:hover{background:rgba(212,185,110,0.1);color:var(--gold)}

.quiz-modal-body{padding:20px 28px 28px;overflow-y:auto;flex:1}
.quiz-modal-body .quiz-question{
  font-size:clamp(17px,2.8vw,22px);font-weight:700;line-height:1.7;
  color:var(--text-white);margin-bottom:28px;min-height:60px;text-align:center;
}
.quiz-modal-body .quiz-options{display:flex;flex-direction:column;gap:10px}
.quiz-modal-body .quiz-option{
  padding:14px 20px;border-radius:14px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);
  color:var(--text-white);font-size:14px;cursor:pointer;
  transition:all 0.3s;text-align:left;
  font-family:'Noto Serif SC',serif;
}
.quiz-modal-body .quiz-option:hover{background:rgba(212,185,110,0.08);border-color:rgba(212,185,110,0.2)}
.quiz-modal-body .quiz-option.correct{
  background:rgba(126,200,160,0.15);border-color:rgba(126,200,160,0.4);color:#7EC8A0;
}
.quiz-modal-body .quiz-option.wrong{
  background:rgba(232,112,64,0.1);border-color:rgba(232,112,64,0.3);color:#E87040;
}
.quiz-modal-body .quiz-option.disabled{pointer-events:none;opacity:0.6}
.quiz-modal-body .quiz-option.disabled.correct{opacity:1}
.quiz-modal-body .quiz-result{
  margin-top:20px;padding:16px 20px;border-radius:14px;
  background:rgba(255,255,255,0.04);border:1px solid rgba(212,185,110,0.1);
  font-size:13px;color:var(--text-dim);line-height:1.8;display:none;
}
.quiz-modal-body .quiz-result.show{display:block}
.quiz-modal-body .quiz-result strong{color:var(--gold-light)}
.quiz-modal-body .quiz-footer{
  margin-top:20px;display:flex;justify-content:space-between;align-items:center;
}

// 获取某年某索引的节气Date对象
function getTermDate(year, idx) {
  const db = TERM_DATES_EXACT[year] || TERM_DATES_EXACT[2026];
  const d = db[idx];
  if (!d) return null;
  return new Date(d[0], d[1], d[2], d[3], d[4], 0);
}

// 获取当前节气索引（基于精确时间）
function getCurrentTermIndex() {
  const now = new Date();
  const year = now.getFullYear();
  const db = TERM_DATES_EXACT[year] || TERM_DATES_EXACT[2026];
  let curIdx = -1;
  for (let i = db.length - 1; i >= 0; i--) {
    const d = db[i];
    const termDate = new Date(d[0], d[1], d[2], d[3], d[4], 0);
    if (now >= termDate) { curIdx = i; break; }
  }
  if (curIdx === -1) {
    // 未到当年第一个节气，取上一年最后一个
    const prevDb = TERM_DATES_EXACT[year - 1] || TERM_DATES_EXACT[2025];
    curIdx = prevDb.length - 1;
  }
  return curIdx;
}

// 获取下一个节气信息（返回 {idx, date, name, daysLeft, hoursLeft}）
function getNextTermInfo() {
  const now = new Date();
  const year = now.getFullYear();
  const db = TERM_DATES_EXACT[year] || TERM_DATES_EXACT[2026];
  
  for (let i = 0; i < db.length; i++) {
    const d = db[i];
    const termDate = new Date(d[0], d[1], d[2], d[3], d[4], 0);
    if (termDate > now) {
      const diffMs = termDate - now;
      const diffH = Math.floor(diffMs / (1000 * 3600));
      const diffD = Math.floor(diffMs / (1000 * 3600 * 24));
      const remH = diffH - diffD * 24;
      return { idx: i, date: termDate, name: TERMS[i].name, daysLeft: diffD, hoursLeft: remH };
    }
  }
  // 跨年到下一年
  const nextDb = TERM_DATES_EXACT[year + 1] || TERM_DATES_EXACT[2026];
  if (nextDb) {
    const d = nextDb[0];
    const termDate = new Date(d[0], d[1], d[2], d[3], d[4], 0);
    const diffMs = termDate - now;
    const diffH = Math.floor(diffMs / (1000 * 3600));
    const diffD = Math.floor(diffMs / (1000 * 3600 * 24));
    const remH = diffH - diffD * 24;
    return { idx: 0, date: termDate, name: TERMS[0].name, daysLeft: diffD, hoursLeft: remH };
  }
  return null;
}

// ===== 计算当天在节气盘上的精确角度 =====
// 节气盘：24等分，每格15°，从立春(索引0)开始，顺时针
// 针指向：起点-90°（正上方=立春前一天附近），索引i对应角度 = i*15 - 90（度）
// 这里我们基于"当前时刻在上一个节气 -> 下一个节气之间的进度"插值
function getCurrentAngleDeg() {
  const now = new Date();
  const year = now.getFullYear();
  const curIdx = getCurrentTermIndex();
  
  // 当前节气时刻
  const db = TERM_DATES_EXACT[year] || TERM_DATES_EXACT[2026];
  const curD = db[curIdx];
  const curDate = curD ? new Date(curD[0], curD[1], curD[2], curD[3], curD[4], 0) : now;
  
  // 下一个节气时刻
  let nextIdx = (curIdx + 1) % 24;
  let nextDate;
  if (nextIdx === 0 || curIdx === 23) {
    // 跨年
    const nextDb = TERM_DATES_EXACT[year + 1] || TERM_DATES_EXACT[2026];
    if (nextDb) {
      const nd = nextDb[0];
      nextDate = new Date(nd[0], nd[1], nd[2], nd[3], nd[4], 0);
    } else {
      nextDate = new Date(curDate.getTime() + 15 * 24 * 3600 * 1000);
    }
  } else {
    const nd = db[nextIdx];
    nextDate = nd ? new Date(nd[0], nd[1], nd[2], nd[3], nd[4], 0) : new Date(curDate.getTime() + 15 * 24 * 3600 * 1000);
  }
  
  // 计算进度 [0,1)
  const totalMs = nextDate - curDate;
  const passedMs = now - curDate;
  const progress = Math.min(Math.max(passedMs / totalMs, 0), 1);
  
  // 角度：curIdx*15 + progress*15（每个节气占15°）
  const angleDeg = curIdx * 15 + progress * 15;
  return angleDeg; // 相对于圆盘坐标系（0°=立春位置=顺时针0格）
}

// ===== Starfield =====
function initStarfield(){
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let w, h, stars = [];
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  
  for(let i=0;i<200;i++){
    stars.push({
      x:Math.random()*w, y:Math.random()*h,
      r:Math.random()*1.5+0.3,
      alpha:Math.random()*0.6+0.2,
      speed:Math.random()*0.3+0.05,
      phase:Math.random()*Math.PI*2
    });
  }
  
  function draw(){
    ctx.clearRect(0,0,w,h);
    const t = Date.now()*0.001;
    stars.forEach(s=>{
      const flicker = 0.5+0.5*Math.sin(t*s.speed+s.phase);
      const a = s.alpha * flicker;
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(255,255,240,${a})`;
      ctx.fill();
      if(s.r > 1.2){
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r*3,0,Math.PI*2);
        ctx.fillStyle = `rgba(212,185,110,${a*0.15})`;
        ctx.fill();
      }
    });
    requestAnimationFrame(draw);
  }
  draw();
}

// ===== Build Wheel =====
function buildWheel(){
  const svg = document.getElementById('wheel-svg');
  svg.innerHTML = '';
  const cx=320,cy=320;
  
  const outerR = 280;
  const midR = 220;
  const innerR = 160;
  const centerR = 90;
  
  // Background circles
  [{r:outerR+15,cls:'wheel-outer-ring'},{r:midR,cls:'wheel-mid-ring'},{r:innerR,cls:'wheel-inner-ring'}].forEach(c=>{
    const circle = document.createElementNS('http://www.w3.org/2000/svg','circle');
    circle.setAttribute('cx',cx);circle.setAttribute('cy',cy);circle.setAttribute('r',c.r);
    circle.setAttribute('class',c.cls);
    svg.appendChild(circle);
  });
  
  // Season arcs
  const seasonArcs = [
    {season:'spring',startIdx:0,endIdx:5,color:SEASON_HEX.spring},
    {season:'summer',startIdx:6,endIdx:11,color:SEASON_HEX.summer},
    {season:'autumn',startIdx:12,endIdx:17,color:SEASON_HEX.autumn},
    {season:'winter',startIdx:18,endIdx:23,color:SEASON_HEX.winter}
  ];
  seasonArcs.forEach(sa=>{
    const startAngle = (sa.startIdx * 15 - 90) * Math.PI/180;
    const endAngle = ((sa.endIdx+1) * 15 - 90) * Math.PI/180;
    const x1=cx+(outerR+15)*Math.cos(startAngle),y1=cy+(outerR+15)*Math.sin(startAngle);
    const x2=cx+(outerR+15)*Math.cos(endAngle),y2=cy+(outerR+15)*Math.sin(endAngle);
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${x1} ${y1} A ${outerR+15} ${outerR+15} 0 0 1 ${x2} ${y2}`);
    path.setAttribute('class','season-arc');path.setAttribute('stroke',sa.color);
    svg.appendChild(path);
  });
  
  // Tick marks
  for(let i=0;i<24;i++){
    const angle = (i*15-90)*Math.PI/180;
    const isMajor = i%6===0;
    const inner = isMajor ? outerR-8 : outerR-4;
    const x1=cx+inner*Math.cos(angle),y1=cy+inner*Math.sin(angle);
    const x2=cx+(outerR+2)*Math.cos(angle),y2=cy+(outerR+2)*Math.sin(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1);line.setAttribute('y1',y1);
    line.setAttribute('x2',x2);line.setAttribute('y2',y2);
    line.setAttribute('class',isMajor?'wheel-tick-major':'wheel-tick');
    svg.appendChild(line);
  }
  
  // Icon ring (mid)
  TERMS.forEach((term,i)=>{
    const angle = (i*15-90)*Math.PI/180;
    const ix = cx+midR*Math.cos(angle), iy = cy+midR*Math.sin(angle);
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','icon-ring-item');
    g.setAttribute('transform',`translate(${ix},${iy})`);
    g.onclick = ()=>selectTerm(i);
    const bg = document.createElementNS('http://www.w3.org/2000/svg','circle');
    bg.setAttribute('cx',0);bg.setAttribute('cy',0);bg.setAttribute('r',18);
    bg.setAttribute('fill','rgba(255,255,255,0.04)');bg.setAttribute('stroke','rgba(212,185,110,0.08)');
    bg.setAttribute('stroke-width','1');
    const txt = document.createElementNS('http://www.w3.org/2000/svg','text');
    txt.setAttribute('x',0);txt.setAttribute('y',1);
    txt.setAttribute('text-anchor','middle');txt.setAttribute('dominant-baseline','middle');
    txt.setAttribute('font-size','16');txt.textContent=term.icon;
    g.appendChild(bg);g.appendChild(txt);
    svg.appendChild(g);
  });
  
  // Term dots + labels (outer)
  TERMS.forEach((term,i)=>{
    const angle = (i*15-90)*Math.PI/180;
    const dx=cx+outerR*Math.cos(angle),dy=cy+outerR*Math.sin(angle);
    const lr=outerR+40;
    const lx=cx+lr*Math.cos(angle),ly=cy+lr*Math.sin(angle);
    
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','term-dot'+(i===activeTermIdx?' active':''));
    g.setAttribute('data-idx',i);
    g.onclick = ()=>selectTerm(i);
    
    const glow = document.createElementNS('http://www.w3.org/2000/svg','circle');
    glow.setAttribute('cx',dx);glow.setAttribute('cy',dy);glow.setAttribute('r','12');
    glow.setAttribute('class','dot-glow');
    
    const core = document.createElementNS('http://www.w3.org/2000/svg','circle');
    core.setAttribute('cx',dx);core.setAttribute('cy',dy);core.setAttribute('r','5');
    core.setAttribute('class','dot-core');
    
    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
    label.setAttribute('x',lx);label.setAttribute('y',ly);
    label.setAttribute('class','dot-label');
    label.setAttribute('text-anchor','middle');label.setAttribute('dominant-baseline','middle');
    label.textContent = term.name;
    
    g.appendChild(glow);g.appendChild(core);g.appendChild(label);
    svg.appendChild(g);
  });
  
  // ===== 金色指针（当前节气，固定） =====
  const needleG = document.createElementNS('http://www.w3.org/2000/svg','g');
  needleG.setAttribute('id','needle-group');
  const needleAngle = activeTermIdx * 15; // 对应节气盘格度数（从正上方立春顺时针）
  needleG.setAttribute('transform',`rotate(${needleAngle - 90},${cx},${cy})`);
  // 注意：节气盘绘制时，0°在右（SVG坐标），-90偏移后立春在正上方
  // 指针初始指向右方(0°)，旋转 needleAngle*15 - 90 就指向节气位置
  
  const needleLine = document.createElementNS('http://www.w3.org/2000/svg','line');
  needleLine.setAttribute('x1',cx);needleLine.setAttribute('y1',cy);
  needleLine.setAttribute('x2',cx+outerR*0.75);needleLine.setAttribute('y2',cy);
  needleLine.setAttribute('class','wheel-needle-line');
  
  const needleTip = document.createElementNS('http://www.w3.org/2000/svg','circle');
  needleTip.setAttribute('cx',cx+outerR*0.75);needleTip.setAttribute('cy',cy);
  needleTip.setAttribute('r','4');needleTip.setAttribute('class','wheel-needle-dot');
  
  const needleCenter = document.createElementNS('http://www.w3.org/2000/svg','circle');
  needleCenter.setAttribute('cx',cx);needleCenter.setAttribute('cy',cy);
  needleCenter.setAttribute('r','6');needleCenter.setAttribute('class','wheel-needle-dot');
  
  needleG.appendChild(needleLine);needleG.appendChild(needleTip);needleG.appendChild(needleCenter);
  svg.appendChild(needleG);
  
  // ===== 红色虚线指针（今日精确时刻，实时更新） =====
  const timeNeedleG = document.createElementNS('http://www.w3.org/2000/svg','g');
  timeNeedleG.setAttribute('id','time-needle-group');
  timeNeedleG.setAttribute('class','wheel-time-needle-group');

  timeNeedleLine.setAttribute('x1',cx);timeNeedleLine.setAttribute('y1',cy);
  timeNeedleLine.setAttribute('x2',cx+outerR*0.88);timeNeedleLine.setAttribute('y2',cy);
  timeNeedleLine.setAttribute('class','wheel-time-needle-line');
  
  const timeNeedleDot = document.createElementNS('http://www.w3.org/2000/svg','circle');
  timeNeedleDot.setAttribute('cx',cx+outerR*0.88);timeNeedleDot.setAttribute('cy',cy);
  timeNeedleDot.setAttribute('r','3.5');timeNeedleDot.setAttribute('class','wheel-time-needle-dot');
  
  timeNeedleG.appendChild(timeNeedleLine);timeNeedleG.appendChild(timeNeedleDot);
  svg.appendChild(timeNeedleG);
  
  // Center circle
  const centerCircle = document.createElementNS('http://www.w3.org/2000/svg','circle');
  centerCircle.setAttribute('cx',cx);centerCircle.setAttribute('cy',cy);centerCircle.setAttribute('r',centerR);
  centerCircle.setAttribute('class','wheel-center-circle');
  svg.appendChild(centerCircle);
  
  const centerText = document.createElementNS('http://www.w3.org/2000/svg','text');

  const centerSub = document.createElementNS('http://www.w3.org/2000/svg','text');
  centerSub.setAttribute('x',cx);centerSub.setAttribute('y',cy+12);

  // 初始更新时间指针
  updateTimeNeedle();

// ===== 更新实时时间指针 =====
function updateTimeNeedle() {
  const cx = 320, cy = 320;
  const outerR = 280;
  
  // 获取当前精确角度（0°=立春节气位置，顺时针每格15°）
  const angleDeg = getCurrentAngleDeg();
  // 转成SVG旋转角：节气盘0格（立春）在SVG -90°处（正上方），所以旋转 = angleDeg - 90
  const svgAngle = angleDeg - 90;
  
  const timeNeedleG = document.getElementById('time-needle-group');
  if (timeNeedleG) {
    timeNeedleG.setAttribute('transform', `rotate(${svgAngle},${cx},${cy})`);
  }
  
  // 更新中心时间文字
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const timeText = document.getElementById('center-time-text');
  if (timeText) {
    timeText.textContent = `${hh}:${mm}`;
  }
}

// ===== Select Term =====
function selectTerm(idx){
  activeTermIdx = idx;
  const term = TERMS[idx];
  
  // Update dots
  document.querySelectorAll('.term-dot').forEach((d,i)=>{
    d.classList.toggle('active',i===idx);
  });
  
  // Update 金色指针 - 旋转到选中节气
  const needleG = document.getElementById('needle-group');
  if(needleG){
    const cx=320,cy=320;
    // 每个节气占15°，从正上方（-90°）顺时针，所以旋转角 = idx*15 - 90
    needleG.setAttribute('transform',`rotate(${idx*15 - 90},${cx},${cy})`);
  }
  
  // Update center text
  const ct = document.getElementById('center-term-text');
  if(ct) ct.textContent = term.name;
  const cs = document.getElementById('center-sub-text');
  if(cs) cs.textContent = term.date;
  
  // Switch season
  switchSeason(term.season, false);
}

// ===== Switch Season =====
function switchSeason(season, animate=true){
  if(currentSeason === season && animate) return;
  currentSeason = season;
  document.documentElement.style.setProperty('--current-accent',SEASON_COLORS[season]);
}

function getWallpaperDimensions(ratio) {
  const base = 1080;
  if (ratio === '9:16') return { w: base, h: Math.round(base * 16/9) };
  if (ratio === '16:9') return { w: Math.round(base * 16/9), h: base };
  return { w: base, h: base };
}

// 绘制装饰性中国风边框
function drawDecorativeBorder(ctx, w, h, palette) {
  const margin = 30;
  const accent = palette.accent;
  const alpha = palette.dark ? 0.25 : 0.15;
  
  // 外边框
  ctx.strokeStyle = hexToRgba(accent, alpha + 0.1);
  ctx.lineWidth = 2;
  ctx.strokeRect(margin, margin, w - 2*margin, h - 2*margin);
  
  // 内边框
  ctx.strokeStyle = hexToRgba(accent, alpha);
  ctx.lineWidth = 1;
  ctx.strokeRect(margin + 12, margin + 12, w - 2*(margin+12), h - 2*(margin+12));
  
  // 四角装饰
  const cornerSize = 40;
  const corners = [
    [margin, margin, 1, 1],
    [w-margin, margin, -1, 1],
    [margin, h-margin, 1, -1],
    [w-margin, h-margin, -1, -1]
  ];
  
  ctx.strokeStyle = hexToRgba(accent, alpha + 0.2);
  ctx.lineWidth = 3;
  corners.forEach(([cx, cy, dx, dy]) => {
    ctx.beginPath();
    ctx.moveTo(cx, cy + dy*cornerSize);
    ctx.lineTo(cx, cy);
    ctx.lineTo(cx + dx*cornerSize, cy);
    ctx.stroke();
    
    // 角点圆
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI*2);
    ctx.fillStyle = hexToRgba(accent, alpha + 0.25);
    ctx.fill();
  });
}

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// 绘制粒子/雪花/花瓣等装饰
function drawParticles(ctx, w, h, termName, palette) {
  const particles = [];
  const season = TERMS.find(t=>t.name===termName)?.season || 'spring';
  
  // 根据季节决定粒子类型
  const count = 60;
  for (let i = 0; i < count; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      size: Math.random() * 4 + 2,
      speed: Math.random() * 0.3 + 0.1,
      opacity: Math.random() * 0.4 + 0.1,
      phase: Math.random() * Math.PI * 2
    });
  }
  
  const t = Date.now() * 0.001;
  const decoColor = palette.deco;
  
  particles.forEach(p => {
    const offsetY = Math.sin(t * p.speed + p.phase) * 30;
    const y = (p.y + offsetY + h) % h;
    
    ctx.beginPath();
    if (season === 'winter' && termName !== '冬至') {
      // 雪花形状
      ctx.fillStyle = hexToRgba(decoColor, p.opacity * 1.5);
      drawSnowflake(ctx, p.x, y, p.size);
    } else if (season === 'spring') {
      // 小花瓣
      ctx.fillStyle = hexToRgba(decoColor, p.opacity);
      ctx.arc(p.x, y, p.size, 0, Math.PI*2);
      ctx.fill();
    } else if (season === 'autumn') {
      // 落叶小点
      ctx.fillStyle = hexToRgba(decoColor, p.opacity);
      ctx.fillRect(p.x - p.size/2, y - p.size/2, p.size, p.size*0.6);
    } else {
      // 夏天 - 光点
      ctx.fillStyle = hexToRgba(decoColor, p.opacity * 1.3);
      ctx.arc(p.x, y, p.size*0.7, 0, Math.PI*2);
      ctx.fill();
    }
  });
}

function drawSnowflake(ctx, x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  for (let i = 0; i < 6; i++) {
    ctx.rotate(Math.PI / 3);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, -size);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, -size*0.5);
    ctx.lineTo(size*0.3, -size*0.7);
    ctx.moveTo(0, -size*0.5);
    ctx.lineTo(-size*0.3, -size*0.7);
    ctx.stroke();
  }
  ctx.restore();
}

// 绘制水墨山水背景
function drawInkWash(ctx, w, h, palette) {
  const isDark = palette.dark;
  const color = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';
  
  // 远山层叠
  const mountains = [
    { baseY: h*0.7, peaks: 5, height: h*0.2, color: isDark ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.03)' },
    { baseY: h*0.75, peaks: 4, height: h*0.15, color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' },
    { baseY: h*0.8, peaks: 6, height: h*0.1, color: isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.07)' },
  ];
  
  mountains.forEach(m => {
    ctx.fillStyle = m.color;
    ctx.beginPath();
    ctx.moveTo(-50, h + 50);
    const peakWidth = (w + 100) / m.peaks;
    for (let i = 0; i <= m.peaks; i++) {
      const px = i * peakWidth - 50;
      const variation = Math.sin(i * 1.5) * m.height * 0.5;
      const py = m.baseY - m.height * 0.5 + variation;
      ctx.lineTo(px, py);
    }
    ctx.lineTo(w + 50, h + 50);
    ctx.closePath();
    ctx.fill();
  });
  
  // 飞鸟
  for (let i = 0; i < 3; i++) {
    const bx = w * (0.3 + i * 0.2);
    const by = h * (0.35 + i * 0.08);
    ctx.strokeStyle = isDark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(bx - 8, by);
    ctx.quadraticCurveTo(bx - 4, by - 5, bx, by);
    ctx.quadraticCurveTo(bx + 4, by - 5, bx + 8, by);
    ctx.stroke();
  }
}

// 绘制太阳/月亮
function drawCelestialBody(ctx, w, h, termName, palette) {
  const season = TERMS.find(t=>t.name===termName)?.season || 'spring';
  const isDark = palette.dark;
  
  // 太阳/月亮位置
  const cx = w * 0.75, cy = h * 0.22;
  const radius = 50;
  
  if (isDark) {
    // 月亮 + 光晕
    const glow = ctx.createRadialGradient(cx, cy, radius*0.5, cx, cy, radius*2.5);
    glow.addColorStop(0, hexToRgba('#FFD700', 0.3));
    glow.addColorStop(0.5, hexToRgba('#FFD700', 0.1));
    glow.addColorStop(1, 'rgba(255,215,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, radius*2.5, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = palette.bg[0];
    ctx.beginPath(); ctx.arc(cx + 15, cy - 10, radius*0.7, 0, Math.PI*2); ctx.fill();
  } else if (season === 'summer') {
    // 烈日
    const glow = ctx.createRadialGradient(cx, cy, radius*0.3, cx, cy, radius*2);
    glow.addColorStop(0, hexToRgba(palette.accent, 0.3));
    glow.addColorStop(0.5, hexToRgba(palette.accent, 0.1));
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, radius*2, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = hexToRgba(palette.accent, 0.7);
    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI*2); ctx.fill();
  } else if (season === 'spring' || season === 'autumn') {
    // 柔和的太阳
    const glow = ctx.createRadialGradient(cx, cy, radius*0.5, cx, cy, radius*1.8);
    glow.addColorStop(0, hexToRgba(palette.accent, 0.2));
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(cx, cy, radius*1.8, 0, Math.PI*2); ctx.fill();
    
    ctx.fillStyle = hexToRgba(palette.accent, 0.4);
    ctx.beginPath(); ctx.arc(cx, cy, radius*0.6, 0, Math.PI*2); ctx.fill();
  }
}

// 节气拼音映射
const PINYIN_MAP = {
  '立春':'Lì Chūn','雨水':'Yǔ Shuǐ','惊蛰':'Jīng Zhé','春分':'Chūn Fēn','清明':'Qīng Míng','谷雨':'Gǔ Yǔ',
  '立夏':'Lì Xià','小满':'Xiǎo Mǎn','芒种':'Máng Zhòng','夏至':'Xià Zhì','小暑':'Xiǎo Shǔ','大暑':'Dà Shǔ',
  '立秋':'Lì Qiū','处暑':'Chù Shǔ','白露':'Bái Lù','秋分':'Qiū Fēn','寒露':'Hán Lù','霜降':'Shuāng Jiàng',
  '立冬':'Lì Dōng','小雪':'Xiǎo Xuě','大雪':'Dà Xuě','冬至':'Dōng Zhì','小寒':'Xiǎo Hán','大寒':'Dà Hán'
};

// 竖排版：手机 / 方形壁纸
function renderWallpaperVertical(ctx, w, h, term, palette) {
  // 背景渐变
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, palette.bg[0]);
  grad.addColorStop(0.6, palette.bg[1] || palette.bg[0]);
  grad.addColorStop(1, palette.bg[2] || palette.bg[0]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  drawInkWash(ctx, w, h, palette);
  drawCelestialBody(ctx, w, h, term.name, palette);
  drawParticles(ctx, w, h, term.name, palette);
  drawDecorativeBorder(ctx, w, h, palette);

  // 主标题
  const titleY = h * 0.32;
  ctx.fillStyle = palette.accent;
  ctx.font = `bold ${Math.round(w*0.14)}px "Noto Serif SC", serif`;
  ctx.textAlign = 'center';
  ctx.fillText(term.name, w/2, titleY);

  // 拼音
  ctx.fillStyle = hexToRgba(palette.text, 0.5);
  ctx.font = `${Math.round(w*0.03)}px "Noto Serif SC", serif`;
  ctx.fillText(PINYIN_MAP[term.name] || '', w/2, titleY + w*0.08);

  // 诗句
  const poemY = h * 0.52;
  ctx.fillStyle = hexToRgba(palette.text, 0.75);
  ctx.font = `${Math.round(w*0.042)}px "ZCOOL XiaoWei", "Noto Serif SC", serif`;
  const maxChars = 12;
  const poemLines = [];
  for (let i = 0; i < term.poem.length; i += maxChars) {
    poemLines.push(term.poem.slice(i, i + maxChars));
  }
  poemLines.forEach((line, i) => {
    ctx.fillText(line, w/2, poemY + i * w*0.055);
  });

  // 作者
  ctx.fillStyle = hexToRgba(palette.text, 0.4);
  ctx.font = `${Math.round(w*0.025)}px "Noto Serif SC", serif`;
  ctx.fillText('—— ' + term.poet, w/2, poemY + poemLines.length * w*0.055 + w*0.04);

  // 图标
  ctx.font = `${Math.round(w*0.1)}px serif`;
  ctx.fillText(term.icon, w/2, h * 0.73);

  // 日期
  ctx.fillStyle = hexToRgba(palette.text, 0.55);
  ctx.font = `${Math.round(w*0.03)}px "Noto Serif SC", serif`;
  ctx.fillText(term.date, w/2, h * 0.80);

  // 底部文字
  ctx.fillStyle = hexToRgba(palette.text, 0.25);
  ctx.font = `${Math.round(w*0.018)}px "Noto Serif SC", serif`;
  ctx.fillText('廿 四 节 气  ·  时 令 诗 境', w/2, h * 0.92);

  // 底部线
  ctx.strokeStyle = hexToRgba(palette.accent, 0.15);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(w*0.25, h*0.935);
  ctx.lineTo(w*0.75, h*0.935);
  ctx.stroke();
}

// 横排版：电脑壁纸 (16:9) — 左右分区，左侧文字 + 右侧图标装饰
function renderWallpaperHorizontal(ctx, w, h, term, palette) {
  // 背景渐变（水平方向，从左到右）
  const grad = ctx.createLinearGradient(0, 0, w, 0);
  grad.addColorStop(0, palette.bg[0]);
  grad.addColorStop(0.5, palette.bg[1] || palette.bg[0]);
  grad.addColorStop(1, palette.bg[2] || palette.bg[0]);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // 水墨山水 — 移到下半区域，压低高度
  drawInkWash(ctx, w, h, palette);
  // 天体 — 移到右上角
  drawCelestialBody(ctx, w, h, term.name, palette);
  drawParticles(ctx, w, h, term.name, palette);
  drawDecorativeBorder(ctx, w, h, palette);

  // === 左侧：文字区域（占60%宽度） ===
  const leftX = w * 0.12;
  const textW = w * 0.46;

  // 节气图标 + 主标题（水平排列）
  const iconSize = Math.round(h * 0.14);
  ctx.font = `${iconSize}px serif`;
  ctx.textAlign = 'left';
  const iconX = leftX;
  const titleBaseY = h * 0.32;
  ctx.fillText(term.icon, iconX, titleBaseY + iconSize * 0.3);

  // 主标题（图标右侧）
  const titleFontSize = Math.round(h * 0.18);
  ctx.fillStyle = palette.accent;
  ctx.font = `bold ${titleFontSize}px "Noto Serif SC", serif`;
  ctx.textAlign = 'left';
  ctx.fillText(term.name, iconX + iconSize + 24, titleBaseY);

  // 拼音（标题下方）
  ctx.fillStyle = hexToRgba(palette.text, 0.45);
  ctx.font = `${Math.round(h*0.03)}px "Noto Serif SC", serif`;
  const pinyinY = titleBaseY + titleFontSize * 0.85;
  ctx.fillText(PINYIN_MAP[term.name] || '', iconX + iconSize + 24, pinyinY);

  // === 分隔线 ===
  const sepY = titleBaseY + titleFontSize * 1.25;
  ctx.strokeStyle = hexToRgba(palette.accent, 0.2);
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(leftX, sepY);
  ctx.lineTo(leftX + textW, sepY);
  ctx.stroke();

  // === 诗句（左侧排版，大字号） ===
  const poemFontSize = Math.round(h * 0.06);
  const poemY = sepY + h * 0.07;
  ctx.fillStyle = hexToRgba(palette.text, 0.78);
  ctx.font = `${poemFontSize}px "ZCOOL XiaoWei", "Noto Serif SC", serif`;
  ctx.textAlign = 'left';

  // 横版诗句自动换行（每行约 16 个中文字）
  const poemMaxChars = 16;
  const poemHLines = [];
  for (let i = 0; i < term.poem.length; i += poemMaxChars) {
    poemHLines.push(term.poem.slice(i, i + poemMaxChars));
  }
  const lineHeight = poemFontSize * 1.55;
  poemHLines.forEach((line, i) => {
    ctx.fillText(line, leftX, poemY + i * lineHeight);
  });

  // 作者
  const authorY = poemY + poemHLines.length * lineHeight + h * 0.035;
  ctx.fillStyle = hexToRgba(palette.text, 0.38);
  ctx.font = `${Math.round(h*0.028)}px "Noto Serif SC", serif`;
  ctx.fillText('—— ' + term.poet, leftX, authorY);

  // 日期（作者下方）
  ctx.fillStyle = hexToRgba(palette.text, 0.5);
  ctx.font = `${Math.round(h*0.024)}px "Noto Serif SC", serif`;
  ctx.fillText(term.date, leftX, authorY + h * 0.05);

  // === 右侧：节气序号大圆装饰 ===
  const rightCX = w * 0.80;
  const rightCY = h * 0.52;
  const circleR = Math.round(h * 0.16);

  // 大圆光晕
  const circleGlow = ctx.createRadialGradient(rightCX, rightCY, circleR * 0.4, rightCX, rightCY, circleR * 1.5);
  circleGlow.addColorStop(0, hexToRgba(palette.accent, 0.12));
  circleGlow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = circleGlow;
  ctx.beginPath(); ctx.arc(rightCX, rightCY, circleR * 1.5, 0, Math.PI * 2); ctx.fill();

  // 大圆边框
  ctx.strokeStyle = hexToRgba(palette.accent, 0.25);
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(rightCX, rightCY, circleR, 0, Math.PI * 2); ctx.stroke();

  // 内圆
  ctx.strokeStyle = hexToRgba(palette.accent, 0.12);
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(rightCX, rightCY, circleR * 0.75, 0, Math.PI * 2); ctx.stroke();

  // 节气序号 "芒种 · 9 / 24"
  const termIndex = TERMS.findIndex(t => t.name === term.name);
  ctx.fillStyle = hexToRgba(palette.accent, 0.6);
  ctx.font = `bold ${Math.round(h*0.04)}px "Noto Serif SC", serif`;
  ctx.textAlign = 'center';
  ctx.fillText(`${termIndex + 1} / 24`, rightCX, rightCY - h * 0.012);

  ctx.fillStyle = hexToRgba(palette.text, 0.35);
  ctx.font = `${Math.round(h*0.018)}px "Noto Serif SC", serif`;
  ctx.fillText('廿四节气', rightCX, rightCY + h * 0.025);

  // === 底部文字 ===
  ctx.fillStyle = hexToRgba(palette.text, 0.2);
  ctx.font = `${Math.round(h*0.018)}px "Noto Serif SC", serif`;
  ctx.textAlign = 'center';
  ctx.fillText('廿 四 节 气  ·  时 令 诗 境', w/2, h * 0.94);

  // 底部线
  ctx.strokeStyle = hexToRgba(palette.accent, 0.1);
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(w*0.25, h*0.955);
  ctx.lineTo(w*0.75, h*0.955);
  ctx.stroke();
}

function renderWallpaper(termIdx, sizeRatio) {
  const term = TERMS[termIdx];
  const palette = TERM_PALETTES[term.name] || TERM_PALETTES['立春'];
  const dims = getWallpaperDimensions(sizeRatio);
  const w = dims.w, h = dims.h;

  // 创建/复用 Canvas
  let canvas = document.getElementById('wallpaper-canvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.id = 'wallpaper-canvas';
  }
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');

  if (sizeRatio === '16:9') {
    renderWallpaperHorizontal(ctx, w, h, term, palette);
  } else {
    renderWallpaperVertical(ctx, w, h, term, palette);
  }

  // 显示到预览区
  const preview = document.getElementById('wallpaper-preview');
  preview.innerHTML = '';
  preview.appendChild(canvas);

  // 显示下载按钮
  document.getElementById('wallpaper-download-btn').classList.add('show');

  wallpaperCanvas = canvas;
  currentWallpaperTermIdx = termIdx;
  currentWallpaperSize = sizeRatio;
}

function selectWallpaperSize(el, termName, termIdx) {
  document.querySelectorAll('.size-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  const ratio = el.dataset.ratio;
  renderWallpaper(termIdx, ratio);
}

function downloadWallpaper() {
  if (!wallpaperCanvas) return;
  const term = TERMS[currentWallpaperTermIdx];
  const link = document.createElement('a');
  link.download = `节气壁纸_${term.name}_${currentWallpaperSize.replace(':','x')}.png`;
  link.href = wallpaperCanvas.toDataURL('image/png');
  link.click();
}

// 保留旧函数兼容
function selectSize(el) {
  selectWallpaperSize(el, TERMS[activeTermIdx].name, activeTermIdx);
}
function generateWallpaper(termName) {
  const idx = TERMS.findIndex(t => t.name === termName);
  if (idx >= 0) renderWallpaper(idx, currentWallpaperSize);
}

// ===== Wheel click → open modal =====
document.addEventListener('click',e=>{
  const dot = e.target.closest('.term-dot');
  const icon = e.target.closest('.icon-ring-item');
  if(dot){
    e.stopPropagation();
    const idx = parseInt(dot.dataset.idx);
    if (!isNaN(idx)) {
      selectTerm(idx);
      // 清除键盘高亮
      document.querySelectorAll('.term-dot').forEach(d => d.classList.remove('key-selected'));
      setTimeout(()=>openModal(idx),300);
    }
  }
  if(icon){
    e.stopPropagation();
    const idx = Array.from(document.querySelectorAll('.icon-ring-item')).indexOf(icon);
    if(idx>=0){
      selectTerm(idx);
      document.querySelectorAll('.term-dot').forEach(d => d.classList.remove('key-selected'));
      setTimeout(()=>openModal(idx),300);
    }
  }
});

// ===== Keyboard =====
document.addEventListener('keydown',e=>{
  if(e.key==='Escape') {
    closeModal();
    return;
  }
  const modalOpen = document.getElementById('modal').classList.contains('show');
  if(!modalOpen){
    if(e.key==='ArrowRight') {
      e.preventDefault();
      selectTerm((activeTermIdx+1)%24);
      highlightSelectedTerm();
    }
    if(e.key==='ArrowLeft') {
      e.preventDefault();
      selectTerm((activeTermIdx+23)%24);
      highlightSelectedTerm();
    }
    if(e.key==='Enter') {
      e.preventDefault();
      openModal(activeTermIdx);
    }
  }
});

// 高亮当前选中的节气（方向键导航时的视觉反馈）
function highlightSelectedTerm() {
  // 移除所有键盘高亮
  document.querySelectorAll('.term-dot').forEach(d => d.classList.remove('key-selected'));
  // 高亮当前选中项（active 已被 selectTerm 更新）
  const dot = document.querySelector(`.term-dot[data-idx="${activeTermIdx}"]`);
  if (dot) dot.classList.add('key-selected');
  
  // 中心文字闪烁提示
  const ct = document.getElementById('center-term-text');
  if (ct) {
    ct.classList.add('pulse-text');
    setTimeout(() => ct.classList.remove('pulse-text'), 600);
  }
}

  {q:'"冬至一阳生"是什么意思？',opts:['冬至后气温回升','冬至后阳气开始生长','冬至要吃羊肉'],ans:1,
   explain:'古人认为冬至阴极之至，阳气始生。虽然最冷的日子还在后面，但阳气已开始萌动。'},
  {q:'哪个节气标志着仲冬时节正式开始？',opts:['小雪','大雪','立冬'],ans:1,
   explain:'大雪标志着仲冬时节正式开始，气温显著下降，降雪量增多。'},
  {q:'"谷雨"之名源自哪句古语？',opts:['雨生百谷','谷得雨而生','谷中降雨'],ans:0,
   explain:'谷雨取"雨生百谷"之意，此时降水明显增加，田中秧苗初插，最需雨水滋润。'}
];

let quizIdx = 0;
let quizCorrect = 0;
let quizTotal = 0;
let quizAnswered = false;
let consecutiveCorrect = 0;

function shuffleArray(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

let quizOrder = shuffleArray(QUIZ_DATA.map((_,i)=>i));

function renderQuestion(){
  const data = QUIZ_DATA[quizOrder[quizIdx % quizOrder.length]];
  quizAnswered = false;
  document.getElementById('quiz-question').textContent = data.q;
  const optsEl = document.getElementById('quiz-options');
  optsEl.innerHTML = data.opts.map((o,i)=>
    `<div class="quiz-option" data-idx="${i}" onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</div>`
  ).join('');
  const resultEl = document.getElementById('quiz-result');
  resultEl.classList.remove('show');
  resultEl.innerHTML = '';
  document.getElementById('quiz-next').disabled = true;
}

function answerQuiz(idx){
  if(quizAnswered) return;
  quizAnswered = true;
  quizTotal++;
  const data = QUIZ_DATA[quizOrder[quizIdx % quizOrder.length]];
  const isCorrect = idx === data.ans;
  if(isCorrect){
    quizCorrect++;
    consecutiveCorrect++;
  } else {
    consecutiveCorrect = 0;
  }
  
  document.querySelectorAll('.quiz-option').forEach((el,i)=>{
    if(i === data.ans) el.classList.add('correct');
    if(i === idx && !isCorrect) el.classList.add('wrong');
    if(i !== idx && i !== data.ans) el.classList.add('disabled');
  });
  
  const resultEl = document.getElementById('quiz-result');
  resultEl.innerHTML = isCorrect
    ? `✅ 回答正确！${data.explain}`
    : `❌ 正确答案是 <strong>${String.fromCharCode(65+data.ans)}. ${data.opts[data.ans]}</strong>。${data.explain}`;
  resultEl.classList.add('show');
  
  document.getElementById('quiz-score').textContent = `${quizCorrect} / ${quizTotal}`;
  document.getElementById('quiz-next').disabled = false;

  if(consecutiveCorrect >= 5 && consecutiveCorrect % 5 === 0){
    setTimeout(()=>triggerVictory(), 600);
  }
}

function nextQuestion(){
  quizIdx++;
  if(quizIdx >= quizOrder.length){
    quizOrder = shuffleArray(QUIZ_DATA.map((_,i)=>i));
    quizIdx = 0;
  }
  renderQuestion();
}

function openQuizModal(){
  document.getElementById('quiz-modal').classList.add('show');
  document.getElementById('quiz-overlay').classList.add('show');
  if(quizTotal === 0 && !quizAnswered) renderQuestion();
}
function closeQuizModal(){
  document.getElementById('quiz-modal').classList.remove('show');
  document.getElementById('quiz-overlay').classList.remove('show');
}

// ===== Victory Celebration =====
function triggerVictory(){
  const overlay = document.getElementById('victory-overlay');
  overlay.classList.add('show');
  drawPixelDancer();
  playVictorySound();
  spawnConfetti();
  setTimeout(()=>closeVictory(), 4000);
}
function closeVictory(){
  document.getElementById('victory-overlay').classList.remove('show');
  document.querySelectorAll('.confetti').forEach(c=>c.remove());
}

let dancerFrame = 0;
let dancerInterval = null;
function drawPixelDancer(){
  const canvas = document.getElementById('pixel-dancer');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  if(dancerInterval) clearInterval(dancerInterval);
  
  const frames = [
    ['  111  ',' 11111 ','  111  ',' 11111 ','  222  ',' 22222 ','  2 2  ','  2 2  ','  3 3  ','  3 3  '],
    ['  111  ',' 11111 ','  111  ','2 111 2','2 222 2','  222  ',' 2   2 ',' 2   2 ','3     3','3     3'],
    ['3 111  ','3 11111','  111  ','2 111  ','  222  ','  222  ',' 2   2 ',' 2   2 ','  3   3','  3   3']
  ];
  
  const palette = {1:'#FFD700',2:'#FF6B6B',3:'#4ECDC4',' ':'transparent'};
  
  dancerInterval = setInterval(()=>{
    ctx.clearRect(0,0,80,80);
    const f = frames[dancerFrame % frames.length];
    const px = 8;
    f.forEach((row,y)=>{
      [...row].forEach((ch,x)=>{
        if(ch !== ' '){
          ctx.fillStyle = palette[ch] || '#FFD700';
          ctx.fillRect(x*px, y*px, px, px);
        }
      });
    });
    dancerFrame++;
  }, 250);
}

function playVictorySound(){
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const melody = [
      {f:523,t:0,d:0.15},{f:659,t:0.15,d:0.15},{f:784,t:0.3,d:0.15},
      {f:1047,t:0.45,d:0.3},{f:784,t:0.8,d:0.1},{f:1047,t:0.9,d:0.4},
    ];
    melody.forEach(n=>{
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = 'square';
      osc.frequency.value = n.f;
      gain.gain.setValueAtTime(0.12, ac.currentTime + n.t);
      gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + n.t + n.d);
      osc.connect(gain);gain.connect(ac.destination);
      osc.start(ac.currentTime + n.t);
      osc.stop(ac.currentTime + n.t + n.d + 0.05);
    });
  } catch(e){}
}

function spawnConfetti(){
  const colors = ['#FFD700','#FF6B6B','#4ECDC4','#A78BFA','#FB923C','#34D399'];
  for(let i=0;i<60;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100+'vw';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.animationDuration = (1.5+Math.random()*2)+'s';
    c.style.animationDelay = (Math.random()*0.8)+'s';
    c.style.width = (4+Math.random()*6)+'px';
    c.style.height = (4+Math.random()*6)+'px';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 4500);
  }
}

// ===== 实时更新循环 =====
// 每分钟更新倒计时和时间指针
function startRealtimeUpdate() {
  // 每10秒更新时间指针
  setInterval(()=>{
    updateTimeNeedle();
  }, 10000);
  
  // 每分钟更新倒计时
  setInterval(()=>{
    updateCountdown();
  }, 60000);
}

// ===== Init =====
function init(){
  initStarfield();
  const curIdx = getCurrentTermIndex();
  activeTermIdx = curIdx;
  buildWheel();
  selectTerm(curIdx);
  updateCountdown();
  switchSeason(TERMS[curIdx].season);
  startRealtimeUpdate();
}

init();
</script>
